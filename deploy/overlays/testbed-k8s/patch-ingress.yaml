# k8s 테스트베드 포탈 도메인(dms-k8s.local). catch-all 규칙·어노테이션·강제 리다이렉트는 base 그대로(VIP 직접 접속도
# 지원). 인증서 dms-portal-tls(ns dms, 컨텍스트 dmsk8s)는 ssc 와 **같은 테스트베드 CA** 로 발급하고 SAN 에
# DNS:dms-k8s.local + IP:10.20.20.101(+ 외부 릴레이 IP)를 넣는다 — 키는 git 밖(testbed 저장소 files/tls/, gitignore).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms-portal
  namespace: dms
spec:
  tls:
    - hosts:
        - dms-k8s.local
      secretName: dms-portal-tls
