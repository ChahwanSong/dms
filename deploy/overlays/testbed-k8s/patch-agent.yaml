# k8s 테스트베드 에이전트 DaemonSet 패치(전략적 머지, 컨테이너는 name 으로 병합).
#
# base 는 agent-entrypoint.sh 로 nslcd(LDAP NSS)를 띄운 뒤 `dms agent` 를 exec 한다 — 그 엔트리포인트는 LDAP URI 가
# 없으면 즉시 종료하고, base env 의 LDAP configMapKeyRef 3개는 optional 이 아니라 ConfigMap 에서 키를 지운 순간
# CreateContainerConfigError 다. 그래서 둘 다 여기서 끊는다:
#   - command/args 를 `dms agent` 로 — nslcd 가 뜨지 않고 NSLCD_MANAGED 도 없다(보고에 directory 없음). 포탈 릴리스는
#     image 만 패치하므로(rollout_runner.image_patch_body) 이 명령 오버라이드는 롤아웃 뒤에도 유지된다.
#   - LDAP env 6개 삭제($patch: delete). 신원 프로브 대상은 LDAP 조회가 성공했을 때만 등록되므로 비어 있다.
# base 50-agent-daemonset.yaml 에 LDAP env 가 새로 생기면 tests/test_testbed_k8s_overlay.py 가 빨간불을 낸다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dms-agent
  namespace: dms
spec:
  template:
    spec:
      containers:
        - name: agent
          command: ["dms"]
          args: ["agent"]
          env:
            - name: DMS_LDAP_URI
              $patch: delete
            - name: DMS_LDAP_USER_BASE
              $patch: delete
            - name: DMS_LDAP_GROUP_BASE
              $patch: delete
            - name: DMS_LDAP_USE_START_TLS
              $patch: delete
            - name: DMS_LDAP_BIND_DN
              $patch: delete
            - name: DMS_LDAP_BIND_PW
              $patch: delete
