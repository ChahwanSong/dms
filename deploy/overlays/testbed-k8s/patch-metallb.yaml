# k8s 테스트베드 공인 VIP(10.20.20.101 — ssc 는 10.20.20.100). autoAssign:false·L2Advertisement 의 nodeSelectors
# (network-zone=public)는 base 그대로: k8s-w1·k8s-w2 둘 다 network-zone=public 라벨, ingress-nginx svc 에
# metallb.io/address-pool: dms-public-pool. 이 클러스터의 자동 풀(10.10.10.220–.229)은 testbed IaC 몫이며 ssc 의
# 10.10.10.200–.210 과 겹치면 안 된다(같은 L2 — ARP 충돌).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dms-public-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.20.20.101/32
