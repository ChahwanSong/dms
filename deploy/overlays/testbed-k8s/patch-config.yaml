# k8s 테스트베드 ConfigMap 패치(전략적 머지 — 명시한 키만 덮고, null 은 그 키를 **지운다**).
#
# 잡 이미지·빌드 레지스트리·빌더 이미지는 모두 클러스터 내 레지스트리 10.112.0.50:5000(이 클러스터 전용, 2026-11-03 ④ T4 16
# 전환 — values.env 의 REGISTRY 와 렌더러가 대조한다; 그 전의 pkg-01:5001 은 2026-11-04 삭제). 라이브 잡 이미지는 포탈 릴리스의
# DB 오버라이드(control_state.job_image)가 이 값을 이긴다 — 여기 값은 "오버라이드가 없을 때의 기본" 이자 배지의 매니페스트 기준이다.
#
# k8s 신원 모드(2026-10-25 dms-k8s RBAC·PV 설계 D1·D15 → 2026-10-26 유일한 모드 -- base 20-config 의 DMS_IDENTITY_MODE
# "k8s"): 「모든 단건 잡 root」와 「권한 = k8s RoleBinding 맵핑(<id>-clusterrole-admin|edit → 그 namespace 의 모든 PVC)」.
# 일반 사용자는 PV 주소로 sync·rm 을 내고(DMS_USER_ALLOWED_OPERATIONS — 코드 기본은 sync 뿐; scan 은 특권 운영자만, 2026-10-26),
# 직접 경로·전체 PV 는 아래 특권 목록(또는 계정 화면 부여)의 세션 관리자만이다. 비 root 잡은 생기지 않는다(서버가 run_as_root
# 를 강제 — 명시 false 는 422). LDAP 키는 base 에 없다(2026-10-26 LDAP 코드 삭제 — 예전의 null 패치는 지웠다).
#
# 특권 목록·허용은 base 와 같은 값이지만 명시한다 — 이 클러스터에서는 특권 목록이 「맵핑 면제(전체 PV·직접 경로)」의
# 기준이고 허용 스위치를 끄면 기동을 거부한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-config
  namespace: dms
data:
  DMS_JOB_IMAGE: "10.112.0.50:5000/dms-mpifileutils:d19"
  DMS_BUILD_REGISTRY: "10.112.0.50:5000"
  DMS_BUILD_BUILDER_IMAGE: "10.112.0.50:5000/buildah:stable"
  DMS_PRIVILEGED_REQUESTERS: "root,admin,mason"
  DMS_ALLOW_PRIVILEGED_REQUESTERS: "true"
  DMS_USER_ALLOWED_OPERATIONS: "sync,rm"
  # 계정 메일 도메인 = 테스트베드 RoleBinding subject 의 이메일 도메인(namespaceAdmin 소유자 인식 — k8s_rbac, 2026-10-26 (a)).
  # 가입 인증 메일 주소도 <아이디>@이 도메인이 된다(테스트베드는 stub 메일러).
  DMS_ACCOUNT_EMAIL_DOMAIN: "example.com"
  # 아티팩트 base = file://<SHARED_DIR>/dms/artifacts, SHARED_DIR=/dms_shared(이 디렉터리의 values.env, 2026-11-03 ③).
  # 이 한 값에서 kustomization.yaml 의 replacements 가 allowlist 와 api/controller hostPath·mountPath 를 낸다 -- SHARED_DIR 를
  # 바꾸면 values.env 와 이 줄을 같이 고친다(tests/test_shared_dir_contract.py). 포탈에서 저장한 base(DB control_state)가 있으면
  # 그것이 이긴다 -- 전환 때 같은 값으로 다시 저장한다(deploy/README.md).
  DMS_ARTIFACT_BASE_URI: "file:///dms_shared/dms/artifacts"
