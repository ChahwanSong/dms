# DMS k8s 테스트베드 오버레이(2026-10-21) — 두 번째 테스트베드(dms-k8s 브랜치를 검증한다 — 2026-10-22 부터 main 과 별도 라인).
#
# 클러스터·컨텍스트: k8s-cp1(10.10.10.20) + k8s-w1·k8s-w2(.21·.22), kubeconfig 컨텍스트 **dmsk8s**.
#   current-context 는 ssc 테스트베드(`dms` -- 그 오버레이는 dms-ssc 브랜치에만 있다)로 남겨 두므로 이 오버레이는 **항상
#   --context dmsk8s 로만** 다룬다(두 클러스터가 같은 네임스페이스 이름 dms 를 써서 컨텍스트가 유일한 구분이다):
#     kubectl --context dmsk8s -n dms delete job dms-migrate --ignore-not-found
#     sh deploy/overlays/guard-images.sh deploy/overlays/testbed-k8s --context dmsk8s
#     kubectl --context dmsk8s apply -k deploy/overlays/testbed-k8s
#   가드는 이 디렉터리의 kube-context 파일(dmsk8s)과 다른 컨텍스트를 겨누면 거부한다(exit 4) — testbed-k8s 를
#   dms 에 apply 하는 사고를 막는다. 런북은 deploy/README.md 「두 번째 테스트베드」 절.
#
# LDAP 없음(사용자 결정 2026-10-21 → 2026-10-26 LDAP 코드 삭제): base(deploy/k8s)에 LDAP 키·에이전트 LDAP env·nslcd
#   엔트리포인트가 더는 없다 — 예전의 LDAP null 패치·patch-agent.yaml(에이전트 `dms agent` 직접 기동)은 필요 없어져 지웠다.
#   dms-secrets 는 4키(DMS_DATABASE_URL·DMS_SHARED_TOKEN·DMS_ADMIN_TOKEN·DMS_SESSION_SECRET). 모든 단건 잡이 root 이고 권한은 k8s
#   RoleBinding 맵핑으로 판정한다(일반 사용자는 PV 주소만, 특권 세션 관리자는 직접 경로·전체 PV).
#   tests/test_testbed_k8s_overlay.py 가 렌더 결과에 'ldap'(대소문자 무시) 0건·에이전트 명령·레지스트리·신원 모드를 고정한다.
#
# 레지스트리·태그: pkg-01:5001(같은 VM 의 두 번째 registry:2 — ssc 의 :5000 과 태그·삭제·「사용 중」 판정이 섞이지
#   않게 분리; 빌더 buildah:stable 만 :5000 미러를 공용으로 읽는다). 태그 관례 **dN — d1 부터**(2026-10-26 사용자 결정 「예전
#   dms-ssc 때처럼 d1 부터」 — 포탈의 다음 태그 제안(BuildForm.nextTagSuggestion = 라이브·이 레지스트리·빌드 이력의 dN 최댓값 + 1)이
#   그대로 맞는다. 레지스트리가 :5001 로 갈려 ssc 의 dN 과 번호가 섞이지 않는다). 그 전의 옛 kN 이력:
#   k0 = 첫 설치 시드(:5000 의 dms:d184·dms-agent:d179·dms-mpifileutils:d183 을 :5001 에 k0 으로 복사).
#   k1 = 첫 포탈 빌드(빌드 노드 k8s-w1, 소스 main 체크아웃 928b3c9 — nsync 역할별 볼륨; 이미지 3종 + 잡 이미지).
#   k2 = 전체 작업 검색·열 폭(2026-10-25, 소스 dms-k8s 체크아웃 1b0febe; 이미지 3종 + 잡 이미지).
#   k3 = k8s RBAC·PV 재설계(2026-10-26, 소스 dms-k8s 체크아웃 3e9aae6 — k8s 신원 모드·PV 주소·인벤토리·관리자 화면·PV 봉쇄; 이미지 3종 + 잡 이미지).
#   k4 = 가입 신원 경고·결과 본문 상한(2026-10-26, 소스 a58d897; **dms 이미지만** — dms-agent·잡 이미지는 k3 그대로. 그래서 k4 dms
#        이미지에 동봉된 매니페스트의 에이전트·잡 이미지는 자리표시자라 릴리스 화면의 그 둘 드리프트 배지는 「모름」 — 다음 3종 빌드에서 돌아온다).
#   d1 = dN 관례 첫 태그(2026-10-26, 소스 744e3e5 — nsync 목적지 링크 미추종 dms-mpifileutils 8cd72f3 + root nsync PV 목적지 허용;
#        이미지 3종 + 잡 이미지, 드리프트 배지 셋 다 일치).
#   d2 = dms-mpifileutils 2a10a18(2026-10-26, 소스 5f89b3d — d1 실증에서 찾은 「새 목적지로의 nsync 실패」 수정; 이미지 3종 + 잡 이미지).
#   d3 = PV 목적지 결과 소유 = PV 루트 소유자·setuid 제거(mpifileutils 3c041e0)·namespaceAdmin·scan 특권 운영자·숫자 아이디·배치 PV
#        검색·--context·PG(2026-10-26, 소스 7171b28; 이미지 3종 + 잡 이미지).
#   d4 = LDAP 코드 삭제(k8s 신원 모드 전용 — 에이전트 `dms agent` 직접 기동·nslcd 없음, ConfigMap LDAP 키 삭제) + 리뷰 반영(토큰
#        컨펌 거부·배치 자식 판정 우선·시스템 계정명 예약)(2026-10-26, 소스 46c1264; 이미지 3종 + 잡 이미지).
#   d5 = 스토리지 기본 소유자(uid:gid) — PV 목적지 sync 결과를 그 값으로 chown, 운영자 옵션 PV 루트 소유자(2026-10-26, 소스
#        b31c627; 이미지 3종 + 잡 이미지).
#   d6 = BACKLOG 결정 묶음 — 직접 경로 결과 소유·rm 경로 겹침 잠금·결과 파일 만료·dscan 카운터(mpifileutils ae781bd)·배치
#        CSV/삭제·빌드 GC/삭제·securityContext 드리프트 배지(2026-10-27, 소스 99dd8f5; 이미지 3종 + 잡 이미지).
#   d7 = 요청 상세 단건 삭제 직후 재조회 404 제거 시도 + d6 실증 기록(2026-10-27, 소스 8385852; 이미지 3종 + 잡 이미지).
#   d8 = 단건 삭제 뒤 캐시 제거를 상세 언마운트 때로(404 확실히 제거)(2026-10-27, 소스 4bee5cd; 이미지 3종 + 잡 이미지).
#   태그 bump = 아래 newTag(+ patch-config.yaml 의 DMS_JOB_IMAGE) 커밋 — **dms-k8s 에서만** 한다(2026-10-22 브랜치 분리 뒤
#   빌드 소스는 /home/mason/dms-dev/dms-k8s 체크아웃 = origin/dms-k8s, main 은 이 클러스터와 무관).
#   ssc 클러스터의 오버레이(overlays/testbed)는 dms-ssc 브랜치에만 있다(2026-10-26 이 브랜치에서 지웠다 — 체리픽 충돌·엉뚱한 태그 방지).
#
# Deployment(api/controller) 는 패치하지 않는다 — securityContext 는 base 가 유일한 진실
#   (tests/test_release_manifest_contract.py::test_overlays_do_not_patch_control_plane_deployments).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s

# name 은 base 의 자리표시자 이름과 정확히 같아야 한다(태그 무관 매칭). dms 계보(api·controller 본체 +
# migrate initContainer + 30-migrate-job)는 한 항목이 전부 바꾼다.
images:
  - name: set-by-overlay.invalid/dms
    newName: pkg-01:5001/dms
    newTag: d8
  - name: set-by-overlay.invalid/dms-agent
    newName: pkg-01:5001/dms-agent
    newTag: d8

patches:
  - path: patch-config.yaml
  - path: patch-ingress.yaml
  - path: patch-metallb.yaml
