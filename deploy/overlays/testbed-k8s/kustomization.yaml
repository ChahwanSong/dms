# DMS k8s 테스트베드 오버레이(2026-10-21) — 두 번째 테스트베드(dms-k8s 브랜치를 검증한다 — 2026-10-22 부터 main 과 별도 라인).
#
# 클러스터·컨텍스트: k8s-cp1(10.10.10.20) + k8s-w1·k8s-w2(.21·.22), kubeconfig 컨텍스트 **dmsk8s**.
#   current-context 는 ssc 테스트베드(`dms` -- 그 오버레이는 dms-ssc 브랜치에만 있다)로 남겨 두므로 이 오버레이는 **항상
#   --context dmsk8s 로만** 다룬다(두 클러스터가 같은 네임스페이스 이름 dms 를 써서 컨텍스트가 유일한 구분이다):
#     kubectl --context dmsk8s -n dms delete job dms-migrate --ignore-not-found
#     sh deploy/overlays/guard-images.sh deploy/overlays/testbed-k8s --context dmsk8s
#     kubectl --context dmsk8s apply -k deploy/overlays/testbed-k8s
#   가드는 이 디렉터리의 kube-context 파일(dmsk8s)과 다른 컨텍스트를 겨누면 거부한다(exit 4) — testbed-k8s 를
#   dms 에 apply 하는 사고를 막는다. 런북은 deploy/README.md 「두 번째 테스트베드」 절.
#
# LDAP 없음(사용자 결정 2026-10-21 → 2026-10-26 LDAP 코드 삭제): base(deploy/k8s)에 LDAP 키·에이전트 LDAP env·nslcd
#   엔트리포인트가 더는 없다 — 예전의 LDAP null 패치·patch-agent.yaml(에이전트 `dms agent` 직접 기동)은 필요 없어져 지웠다.
#   dms-secrets 는 4키(DMS_DATABASE_URL·DMS_SHARED_TOKEN·DMS_ADMIN_TOKEN·DMS_SESSION_SECRET). 모든 단건 잡이 root 이고 권한은 k8s
#   RoleBinding 맵핑으로 판정한다(일반 사용자는 PV 주소만, 특권 세션 관리자는 직접 경로·전체 PV).
#   tests/test_testbed_k8s_overlay.py 가 렌더 결과에 'ldap'(대소문자 무시) 0건·에이전트 명령·레지스트리·신원 모드를 고정한다.
#
# 레지스트리·태그: **클러스터 내 레지스트리 10.112.0.50:5000**(2026-11-03 T4 전환 — deploy/platform/registry, cp1, 저장소
#   /dms_shared/dms/registry; 빌더 buildah:stable 도 여기). 그 전(d18 까지)은 pkg-01:5001(같은 VM 의 두 번째 registry:2 — ssc 의
#   :5000 과 분리)이었고 되돌림용으로 그대로 둔다(deploy/README §2e-6). 태그 관례 **dN — d1 부터**(2026-10-26 사용자 결정 「예전
#   dms-ssc 때처럼 d1 부터」 — 포탈의 다음 태그 제안(BuildForm.nextTagSuggestion = 라이브·이 레지스트리·빌드 이력의 dN 최댓값 + 1)이
#   그대로 맞는다. 레지스트리가 :5001 로 갈려 ssc 의 dN 과 번호가 섞이지 않는다). 그 전의 옛 kN 이력:
#   k0 = 첫 설치 시드(:5000 의 dms:d184·dms-agent:d179·dms-mpifileutils:d183 을 :5001 에 k0 으로 복사).
#   k1 = 첫 포탈 빌드(빌드 노드 k8s-w1, 소스 main 체크아웃 928b3c9 — nsync 역할별 볼륨; 이미지 3종 + 잡 이미지).
#   k2 = 전체 작업 검색·열 폭(2026-10-25, 소스 dms-k8s 체크아웃 1b0febe; 이미지 3종 + 잡 이미지).
#   k3 = k8s RBAC·PV 재설계(2026-10-26, 소스 dms-k8s 체크아웃 3e9aae6 — k8s 신원 모드·PV 주소·인벤토리·관리자 화면·PV 봉쇄; 이미지 3종 + 잡 이미지).
#   k4 = 가입 신원 경고·결과 본문 상한(2026-10-26, 소스 a58d897; **dms 이미지만** — dms-agent·잡 이미지는 k3 그대로. 그래서 k4 dms
#        이미지에 동봉된 매니페스트의 에이전트·잡 이미지는 자리표시자라 릴리스 화면의 그 둘 드리프트 배지는 「모름」 — 다음 3종 빌드에서 돌아온다).
#   d1 = dN 관례 첫 태그(2026-10-26, 소스 744e3e5 — nsync 목적지 링크 미추종 dms-mpifileutils 8cd72f3 + root nsync PV 목적지 허용;
#        이미지 3종 + 잡 이미지, 드리프트 배지 셋 다 일치).
#   d2 = dms-mpifileutils 2a10a18(2026-10-26, 소스 5f89b3d — d1 실증에서 찾은 「새 목적지로의 nsync 실패」 수정; 이미지 3종 + 잡 이미지).
#   d3 = PV 목적지 결과 소유 = PV 루트 소유자·setuid 제거(mpifileutils 3c041e0)·namespaceAdmin·scan 특권 운영자·숫자 아이디·배치 PV
#        검색·--context·PG(2026-10-26, 소스 7171b28; 이미지 3종 + 잡 이미지).
#   d4 = LDAP 코드 삭제(k8s 신원 모드 전용 — 에이전트 `dms agent` 직접 기동·nslcd 없음, ConfigMap LDAP 키 삭제) + 리뷰 반영(토큰
#        컨펌 거부·배치 자식 판정 우선·시스템 계정명 예약)(2026-10-26, 소스 46c1264; 이미지 3종 + 잡 이미지).
#   d5 = 스토리지 기본 소유자(uid:gid) — PV 목적지 sync 결과를 그 값으로 chown, 운영자 옵션 PV 루트 소유자(2026-10-26, 소스
#        b31c627; 이미지 3종 + 잡 이미지).
#   d6 = BACKLOG 결정 묶음 — 직접 경로 결과 소유·rm 경로 겹침 잠금·결과 파일 만료·dscan 카운터(mpifileutils ae781bd)·배치
#        CSV/삭제·빌드 GC/삭제·securityContext 드리프트 배지(2026-10-27, 소스 99dd8f5; 이미지 3종 + 잡 이미지).
#   d7 = 요청 상세 단건 삭제 직후 재조회 404 제거 시도 + d6 실증 기록(2026-10-27, 소스 8385852; 이미지 3종 + 잡 이미지).
#   d8 = 단건 삭제 뒤 캐시 제거를 상세 언마운트 때로(404 확실히 제거)(2026-10-27, 소스 4bee5cd; 이미지 3종 + 잡 이미지).
#   d9 = dms-ssc 이식 — mpifileutils 7a3189c · d190 · d191 경로 봉쇄 통일 · d192 summary v2·도구 결과·통계 · d193 포탈(2026-10-28,
#        소스 110a6b2; 이미지 3종 + 잡 이미지).
#   d10 = k8s 연동 호출 노드 카드 — 해결된 실패 구분·클러스터별 연결·보조 연결 확인(trigger check)(2026-10-28, 소스 cd53224;
#        이미지 3종 + 잡 이미지).
#   d11 = 경로 봉쇄 개행 구멍 ② 셸 수정 — realpath 끝 개행 보존(§8, 2026-10-28, 소스 cb0d9b9; 이미지 3종 + 잡 이미지).
#   d12 = 사용량 분석 필터 — 권한 사용자·요청자·PV 이름·namespace·클러스터·StorageClass·구분(2026-10-29, 소스 efa5c13;
#        이미지 3종 + 잡 이미지).
#   d13 = 사용량 분석 하위 메뉴 — 경로별·스토리지별 탭, 경로 상세 오른쪽 시트, 합계 한 줄(2026-10-29, 소스 d95a840;
#        이미지 3종 + 잡 이미지).
#   d14 = d13 + 필터 도움말 「?」를 필터 줄 맨 앞으로(2026-10-29, 소스 a6e68f2; 이미지 3종 + 잡 이미지).
#   d15 = 사용량 경로별 표에 PV 이름 열 + 검색을 경로·PV 이름 부분 일치로(2026-10-29, 소스 4934968; 이미지 3종 + 잡 이미지).
#   d16 = 사용량 분석 「소속별」 탭 — /breakdown(권한 사용자·요청자·namespace·PV 이름·SC·클러스터별 실 사용량 순위)(2026-10-30,
#         소스 ab8f02b; 이미지 3종 + 잡 이미지).
#   d17 = ① B3 잡 객체 채택·회수 + ② 로그인·식별(아이디 기준 상한·보호 장치·관리자 구제·보안 이벤트 화면)(2026-11-03, 소스 99eebd4; 이미지 3종 + 잡 이미지).
#   d18 = ① B3 + ② 로그인·식별 실증 반영 + ③ 공용 디렉터리(SHARED_DIR) — 아티팩트 hostPath /dms_shared/dms/artifacts(T3), S7 ② 순차 확인, 보안 이벤트 375 쌓기 (b68d50a)
#   d19 = ④ 클러스터 내 레지스트리(10.112.0.50:5000) 첫 포탈 빌드 — 레지스트리 drain·포탈 이미지 삭제 보호(DB 잡 이미지·digest 공유) (01fd922)
#   태그 bump = 아래 newTag(+ patch-config.yaml 의 DMS_JOB_IMAGE) 커밋 — **dms-k8s 에서만** 한다(2026-10-22 브랜치 분리 뒤
#   빌드 소스는 /home/mason/dms-dev/dms-k8s 체크아웃 = origin/dms-k8s, main 은 이 클러스터와 무관).
#   ssc 클러스터의 오버레이(overlays/testbed)는 dms-ssc 브랜치에만 있다(2026-10-26 이 브랜치에서 지웠다 — 체리픽 충돌·엉뚱한 태그 방지).
#   클러스터 내 레지스트리(2026-11-03 ④ — 10.112.0.50:5000, deploy/platform/registry)로 앱을 옮겼다(T4 16 — newName·patch-config 세
#   값·values.env 를 한 커밋에서; 렌더러 `sh deploy/render.sh testbed-k8s` 가 다섯 곳이 같은지 본다, deploy/README §2e-6). 잡 이미지
#   (control_state.job_image)는 전환 뒤 다시 릴리스했다.
#
# Deployment(api/controller) 는 패치하지 않는다 — securityContext 는 base 가 유일한 진실
#   (tests/test_release_manifest_contract.py::test_overlays_do_not_patch_control_plane_deployments). 예외는 아래 replacements
#   의 아티팩트 경로 두 필드뿐이다(2026-11-03 ③ — 그 테스트가 「이미지·그 경로 말고는 base 와 같다」를 렌더로 본다).
#
# 공용 디렉터리(2026-11-03 ③, 설계 v6 3-1·T3): DMS 상태(아티팩트 — 이후 묶음의 PG·레지스트리·백업도)는 3노드 모두가 같은
#   경로에 마운트한 공용 경로 SHARED_DIR=/dms_shared 아래 dms/ 에 둔다. 이 오버레이는 렌더 단계 없이 apply -k 로 바로 쓰므로
#   **렌더의 원천은 patch-config.yaml 의 DMS_ARTIFACT_BASE_URI** 하나이고(아래 replacements 가 거기서 allowlist·hostPath 를 낸다),
#   values.env 의 SHARED_DIR 는 같은 값의 기록이다(kustomize 는 읽지 않는다 -- 공용 스토리지 프로브가 --overlay 로 읽는다).
#   tests/test_shared_dir_contract.py 가 둘과 렌더 결과(base·allowlist·api/controller hostPath)가 같은 <SHARED_DIR>/dms/artifacts
#   인지 고정한다(한쪽만 고치면 빨간불). 옛 base 는 /cephfs/dms/artifacts(라이브 hostPath /cephfs) — 이 값을 담은 apply 는
#   guard-images.sh 가 hostPath 변경으로 exit 5 거부한다. 전환 절차는 deploy/README.md(마친 뒤 ALLOW_HOSTPATH_CHANGE=1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s

# name 은 base 의 자리표시자 이름과 정확히 같아야 한다(태그 무관 매칭). dms 계보(api·controller 본체 +
# migrate initContainer + 30-migrate-job)는 한 항목이 전부 바꾼다.
images:
  - name: set-by-overlay.invalid/dms
    newName: 10.112.0.50:5000/dms
    newTag: d19
  - name: set-by-overlay.invalid/dms-agent
    newName: 10.112.0.50:5000/dms-agent
    newTag: d19

patches:
  - path: patch-config.yaml
  # 입구(2026-11-03 ⑥): 이 테스트베드는 T8 동안 Ingress + MetalLB VIP 10.20.20.101 을 그대로 쓰고 Envoy Gateway(렌더러의 platform/gateway — cp1
  # hostNetwork :443)를 병행한다. 컷오버(별도 승인) 뒤에는 prod 처럼 아래 둘을 빼고 patch-remove-ingress.yaml 을 싣는다(deploy/README §2g-7).
  - path: patch-ingress.yaml
  - path: patch-metallb.yaml

# DMS_ARTIFACT_BASE_URI(file://<SHARED_DIR>/dms/artifacts) 하나에서 allowlist 와 api/controller 의 hostPath·mountPath 를
# 낸다(2026-11-03 ③). replacements 는 위 patches 뒤에 돌아 오버레이 값을 읽는다. 「file://」 로 잘라 둘째 조각 = 호스트 경로
# (scheme 이 없으면 index 1 이 없어 렌더가 실패한다 -- fail-closed). prod 오버레이와 같은 블록이다(두 곳을 같이 고친다).
replacements:
  - source:
      kind: ConfigMap
      name: dms-config
      fieldPath: data.DMS_ARTIFACT_BASE_URI
      options:
        delimiter: "file://"
        index: 1
    targets:
      - select:
          kind: ConfigMap
          name: dms-config
        fieldPaths:
          - data.DMS_ARTIFACT_BASE_ALLOWED_PREFIXES
      - select:
          kind: Deployment
          name: dms-api
        fieldPaths:
          - spec.template.spec.volumes.[name=dms-artifacts].hostPath.path
          - spec.template.spec.containers.[name=api].volumeMounts.[name=dms-artifacts].mountPath
      - select:
          kind: Deployment
          name: dms-controller
        fieldPaths:
          - spec.template.spec.volumes.[name=dms-artifacts].hostPath.path
          - spec.template.spec.containers.[name=controller].volumeMounts.[name=dms-artifacts].mountPath
