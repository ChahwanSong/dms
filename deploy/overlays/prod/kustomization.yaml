# DMS 프로덕션 오버레이(2026-08-20, 사용자 결정: MetalLB 유지 + prod 오버레이 → 2026-11-03 ⑥ 설계 v6 #13: prod 입구는 Envoy Gateway —
# MetalLB·ingress-nginx 를 쓰지 않는다. 공용 base 의 Ingress·MetalLB 풀은 patch-remove-ingress.yaml 이 지우고, 포탈 입구는 렌더러가 내는
# 플랫폼 층 deploy/.rendered/prod/platform/gateway(+ addons/gateway-api·envoy-gateway)다 — deploy/README §2g).
#
# 사이트 중립 base(deploy/k8s/*.yaml — 이미지·아티팩트 경로는 자리표시자 set-by-overlay.invalid)를 두고, 사이트별 값만 여기서
# 덮는다. 이 파일은 **템플릿**이다(REPLACE_* 토큰) -- 직접 `kubectl apply -k deploy/overlays/prod` 하면 REPLACE_ 이미지가 들어가
# pull 에서 실패하고, base 를 raw `kubectl apply -f deploy/k8s/` 해도 자리표시자 이미지라 실패한다(의도).
#
# 진입은 하나다(deploy/README §3-1):
#   1) cp deploy/overlays/prod/values.env.example deploy/overlays/prod/values.env 를 채운다(자리표시자를 이 파일에서 손으로 고치지 않는다).
#   2) sh deploy/install.sh --context <ctx> [--plan]   -- 매 실행 처음에 sh deploy/render.sh prod --context <ctx> 로
#      deploy/.rendered/prod/(app/ = 이 템플릿에 값을 넣은 앱 오버레이 + 플랫폼·애드온 층)를 다시 만들고, 가드(guard-images.sh) 뒤
#      app/ 을 `kubectl --context <ctx> apply -k`(client-side)한다(S11 — migrate 완료 대기·rollout 포함).
#   미리보기만: sh deploy/render.sh prod --context <ctx> 뒤 kubectl --context <ctx> kustomize deploy/.rendered/prod/app
# 한 화면 순서는 deploy/overlays/prod/README.md, 단계 상세는 deploy/README.md(§0 순서 · §2h 설치기 · §3 적용 규칙).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base: 사이트 중립 매니페스트 디렉터리(deploy/k8s/kustomization.yaml — 모든 오버레이 공용)를 참조한다.
# 그 base 가 20-secret.example.yaml 을 제외한 10개 리소스를 모은다 -- 개별 파일이
# 아니라 base 디렉터리를 가리키는 게 kustomize 표준(오버레이 밖 개별 파일 참조는
# 보안 제약에 걸린다).
resources:
  - ../../k8s

# 워크로드 image 필드(dms·dms-agent)를 사내 레지스트리/태그로 재지정한다.
# 주의: ConfigMap 안의 이미지 문자열(DMS_JOB_IMAGE·DMS_BUILD_*)은 이 변환이
# 건드리지 못한다 -- patch-config.yaml 에서 따로 덮는다.
images:
  # base 의 이미지 이름은 사이트 중립 자리표시자(set-by-overlay.invalid/…)다(2026-09-14) --
  # name 은 그 자리표시자와 정확히 같아야 치환된다(태그 무관).
  - name: set-by-overlay.invalid/dms
    newName: REPLACE_REGISTRY/dms          # 예: registry.corp.example/dms
    newTag: REPLACE_DMS_TAG                 # 예: d99 (실제 push 한 태그)
  - name: set-by-overlay.invalid/dms-agent
    newName: REPLACE_REGISTRY/dms-agent
    newTag: REPLACE_DMS_AGENT_TAG           # 예: d80

# 사이트별 값 패치(전략적 머지 -- 명시한 키만 덮고 나머지는 base 유지).
# dms-k8s 브랜치: k8s 신원 모드 전용(2026-10-26 LDAP 코드 삭제) -- base 에 LDAP 키·에이전트 LDAP env·nslcd 엔트리포인트가
# 없어 예전의 LDAP null 패치·patch-agent.yaml 은 지웠다(tests/test_prod_k8s_overlay.py).
patches:
  - path: patch-config.yaml
  # Ingress dms-portal·IPAddressPool dms-public-pool·L2Advertisement dms-public-l2 삭제($patch: delete — 2026-11-03 ⑥). 예전의
  # patch-ingress.yaml(포탈 도메인)·patch-metallb.yaml(공인 VIP)은 지웠다 — 그 값(PORTAL_DOMAIN·PORTAL_VIP)은 render.env 로만 간다.
  - path: patch-remove-ingress.yaml
  # dms-api·dms-controller 를 마스터에 + not-ready·unreachable 30초(2026-11-03 ⑤, 설계 #24·#25). 제어면 Deployment 에서 바꾸는 배치 필드
  # 둘(nodeSelector·tolerations)뿐 — tests/test_release_manifest_contract.py 가 글자 그대로 고정한다. 테스트베드(testbed-k8s)에는 없다(설계 10).
  - path: patch-placement.yaml

# 공용 디렉터리(2026-11-03 ③): patch-config.yaml 의 DMS_ARTIFACT_BASE_URI(file://<SHARED_DIR>/dms/artifacts — render.sh 가
# values.env 의 SHARED_DIR 로 채운다) 하나에서 allowlist 와 api/controller 의 hostPath·mountPath 를 낸다. replacements 는 위
# patches 뒤에 돈다. 「file://」 로 잘라 둘째 조각 = 호스트 경로(scheme 이 없으면 렌더 실패 -- fail-closed). Deployment 에서
# 바꾸는 것은 이 경로 두 필드뿐이다(tests/test_release_manifest_contract.py 가 렌더로 고정). testbed-k8s 오버레이와 같은
# 블록이다(두 곳을 같이 고친다).
replacements:
  - source:
      kind: ConfigMap
      name: dms-config
      fieldPath: data.DMS_ARTIFACT_BASE_URI
      options:
        delimiter: "file://"
        index: 1
    targets:
      - select:
          kind: ConfigMap
          name: dms-config
        fieldPaths:
          - data.DMS_ARTIFACT_BASE_ALLOWED_PREFIXES
      - select:
          kind: Deployment
          name: dms-api
        fieldPaths:
          - spec.template.spec.volumes.[name=dms-artifacts].hostPath.path
          - spec.template.spec.containers.[name=api].volumeMounts.[name=dms-artifacts].mountPath
      - select:
          kind: Deployment
          name: dms-controller
        fieldPaths:
          - spec.template.spec.volumes.[name=dms-artifacts].hostPath.path
          - spec.template.spec.containers.[name=controller].volumeMounts.[name=dms-artifacts].mountPath
