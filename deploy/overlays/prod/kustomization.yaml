# DMS 프로덕션 오버레이(2026-08-20, 사용자 결정: MetalLB 유지 + prod 오버레이).
#
# 테스트베드 매니페스트(deploy/k8s/*.yaml)를 base 로 두고, 사이트별 값만 여기서
# 덮는다. base 는 그대로 `kubectl apply -f deploy/k8s/`(테스트베드 흐름)로도
# 계속 쓸 수 있다 -- 이 파일은 base 에 넣지 않는다(그 디렉터리를 apply -f 하면
# kustomization.yaml 이 리소스로 오인돼 깨진다).
#
# 렌더/적용:
#   kubectl kustomize deploy/overlays/prod          # 미리보기(값 확인)
#   kubectl apply -k deploy/overlays/prod            # 전체 적용
# 단 배포 순서(migrate 완료 대기 등)는 deploy/overlays/prod/README.md 참고 --
# apply -k 는 한 번에 다 올리므로, 그룹별로 나눠 적용하려면 README 의 render+split.
#
# 자리표시자는 손으로 고치지 말고 values.env.example → values.env 를 채운 뒤
# render.sh 가 이 템플릿에 넣게 한다(설치는 install.sh). 상세는 README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base: 테스트베드 매니페스트 디렉터리(deploy/k8s/kustomization.yaml)를 참조한다.
# 그 base 가 20-secret.example.yaml 을 제외한 10개 리소스를 모은다 -- 개별 파일이
# 아니라 base 디렉터리를 가리키는 게 kustomize 표준(오버레이 밖 개별 파일 참조는
# 보안 제약에 걸린다).
resources:
  - ../../k8s

# 워크로드 image 필드(dms·dms-agent)를 사내 레지스트리/태그로 재지정한다.
# 주의: ConfigMap 안의 이미지 문자열(DMS_JOB_IMAGE·DMS_BUILD_*)은 이 변환이
# 건드리지 못한다 -- patch-config.yaml 에서 따로 덮는다.
images:
  - name: pkg-01:5000/dms
    newName: REPLACE_REGISTRY/dms          # 예: registry.corp.example/dms
    newTag: REPLACE_DMS_TAG                 # 예: d99 (실제 push 한 태그)
  - name: pkg-01:5000/dms-agent
    newName: REPLACE_REGISTRY/dms-agent
    newTag: REPLACE_DMS_AGENT_TAG           # 예: d80

# 사이트별 값 패치(전략적 머지 -- 명시한 키만 덮고 나머지는 base 유지).
patches:
  - path: patch-config.yaml
  - path: patch-ingress.yaml
  - path: patch-metallb.yaml
