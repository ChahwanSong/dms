# EnvoyProxy dms-portal — Envoy 데이터 면의 모양(2026-11-03 ⑥, 설계 #14·4-3·5 「원 IP 기록」). Gateway dms-portal 이 infrastructure.parametersRef 로
# 붙인다. EG 는 이것으로 컨트롤러 네임스페이스(기본 envoy-gateway-system)에 DaemonSet·Service 를 만든다(그 ns 가 PSA privileged — addons 층).
#
# 443 직접 bind(4-3 [권고] (i)):
#   - hostNetwork: true — Avi VS-443 의 풀이 마스터 ×3 :443 이다(MetalLB·NodePort 없음). EnvoyProxy 의 pod 필드에 hostNetwork 가 없어 DaemonSet
#     패치로 넣는다. dnsPolicy ClusterFirstWithHostNet 을 같이: EG v1.9 부트스트랩의 xDS 주소가 서비스 DNS 이름
#     envoy-gateway.<EG ns>.svc.<도메인>.:18000 이라 hostNetwork 파드도 클러스터 DNS 를 써야 한다(기본 ClusterFirst 는 hostNetwork 면 노드
#     resolv.conf 로 떨어져 xDS 가 붙지 않는다). 이 「호스트 → ClusterIP」 경로는 레지스트리 pull 과 같다(S6 가 함께 증명).
#     이 패치는 EG 런타임 플래그 EnvoyProxyPatch 가 켜져 있을 때만 적용되고, 꺼져 있으면 **조용히** 무시된다(v1.9 기본 켜짐 — DMS 가 설치한 EG 는
#     설정에 명시, 남이 설치한 EG(C)는 감지가 그 설정을 본다). 무시되면 Envoy 가 파드 네트워크에만 떠 마스터 :443 이 빈다(S12 `ss -ltnp`).
#   - useListenerPortAsContainerPort: true — 기본은 1023 이하 리스너 포트를 +10000 으로 옮긴다(443 → 10443). hostNetwork 에서는 그 옮긴 포트가
#     그대로 호스트에 열려 Avi 풀(:443)과 어긋난다.
#   - Envoy 는 비 root(65532 — EG 기본값). k8s 는 ambient capability 를 주지 않아 NET_BIND_SERVICE 로는 bind 가 안 된다 — 마스터 sysctl
#     net.ipv4.ip_unprivileged_port_start=443(S0-5, /etc/sysctl.d/90-dms-envoy.conf)이 전제다. 빠진 마스터는 **조용히** 빠진다(2026-11-03 ⑥ 리뷰 1):
#     Envoy 는 동적(LDS) 리스너의 bind 실패를 거절(NACK)만 하고 기동을 계속해 파드는 Ready(/ready 200)이고, EG 의 Programmed 는 DaemonSet 의
#     NumberAvailable > 0 만 본다 — 그 마스터 :443 만 LISTEN 이 아니고 Envoy 로그에 `cannot bind '0.0.0.0:443': Permission denied`·`config rejected`
#     가 남는다(Avi 헬스가 그 마스터를 조용히 뺀다). EG 는 같은 설정을 다시 내려 주지 않으므로 sysctl 을 고친 뒤 **그 노드의 Envoy 파드를 지워**
#     다시 띄운다. 그래서 확인은 Programmed 가 아니라 마스터마다 `ss -ltn :443` 이다(deploy/README §2g-3).
#     「root 로 올려 해결」하지 마라: EG 는 막지 않는다(container.securityContext 를 기본값 위에 strategic merge — applySecurityContextOverrides,
#     권한 강제는 PSA 등 외부 정책 몫이라고 상류 주석이 적는다. DS patch 로도 된다). 그래도 쓰지 않는 것은 설계 4-3 의 선택((i) 권고)·비 root
#     원칙·S1 승인 범위 때문이고, 그것을 지키는 것은 이 규약과 계약 테스트(securityContext·runAsUser 0건)다. sysctl 을 받을 수 없는 사이트만
#     설계 4-3 (ii)를 따로 검토한다.
#   - extraArgs --disable-hot-restart(2026-11-03 ⑥ 리뷰 1): EG 는 --base-id 도 이 플래그도 넘기지 않아 Envoy 가 hot restart 를 켠 채 base-id 0 의
#     추상 유닉스 소켓(@envoy_domain_socket_{parent,child}_0 …)을 bind 한다. 추상 소켓은 netns 단위라 hostNetwork 파드는 호스트 것과 겹친다 —
#     Cilium 의 cilium-envoy DaemonSet(hostNetwork, `--base-id 0`)이 이미 그 이름을 잡고 있어 늦게 뜬 쪽이 `unable to bind domain socket with
#     base_id=0 … errno=98` 로 죽는다(Envoy 가 늦으면 CrashLoop, 마스터 재부팅 뒤 Envoy 가 먼저면 cilium-envoy 가 죽어 L7 프록시가 깨진다). EG 는
#     파드를 바꿔 끼울 뿐 hot restart 를 쓰지 않으므로 끈다(--base-id 1 은 다른 hostNetwork Envoy 와 다시 겹칠 수 있다).
#   - 마스터 호스트에 함께 열리는 포트(K6 — 비어 있어야 한다): :443(리스너), :19001(stats), :19003(readiness), :19002(shutdown-manager),
#     127.0.0.1:19000(admin).
# 배치: control-plane 노드에만(nodeSelector + control-plane taint toleration) — 마스터 ×3 = DS 3(#14). DS 는 not-ready·unreachable 를 스스로 견딘다.
#   롤링은 노드마다 옛 파드를 내린 뒤 새 파드(maxSurge 0 — 같은 호스트 포트라 겹칠 수 없다): 그 마스터는 잠깐 빠지고 Avi 헬스 모니터가 거른다.
# 이미지(airgap): envoy = container.image, shutdown-manager = 패치(EnvoyProxy 에 그 필드가 없다 — EG 설정의 shutdownManager.image 는 DMS 가 설치한
#   EG(A)에서만 DMS 값이다. 남이 설치한 EG(C)에서도 docker.io 로 가지 않게 여기서 명시한다). 둘 다 사이트 중립 자리표시자 — 렌더러가 lock 의
#   digest ref 로 바꾼다. imagePullPolicy IfNotPresent(EG 기본과 같지만 계약으로 고정).
# 접근 로그(K15): JSON 한 줄/요청, stdout(kubectl logs·노드 로그 수집기). client_ip = %DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% — PROXY v2 헤더의
#   출발지(원 IP; PROXY 가 없던 연결은 직접 피어), peer = %DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT% — 실제 TCP 피어(Avi SE). 이름은 앱 이벤트의
#   {client_ip, peer}(src/dms/api/auth.py request_origin)와 같지만 peer 의 값은 다르다 — 앱의 peer 는 소켓 피어 = Envoy 가 뜬 마스터의 호스트
#   쪽 출발 주소(hostNetwork — EG 는 Service 가 아니라 엔드포인트 파드 IP 로 붙는다)이고, 이 로그의 peer 는 SE 다. Cilium 이면 그 출발 주소는 노드 IP 가
#   아니라 그 노드의 cilium_host(CiliumInternalIP — 파드 대역, dmsk8s cp1 은 10.245.0.129; `ip route get <파드 IP>` 의 src)다(2026-11-03 ⑥ 리뷰 2 —
#   노드 IP 와 대조해 「앞단 계약이 깨졌다」로 읽지 않는다, 기록 전용 칸). client_ip 는 둘이 같다. 경로는 쿼리를 뺀다(REQ_WITHOUT_QUERY — 상세는
#   앱 로그·이벤트). x_forwarded_for 는 Envoy 가 원 IP 를 덧붙인 뒤의 값이다(마지막 항목 = client_ip — 앱이 읽는 값). 예외 하나(2026-11-03 ⑥ 리뷰 2):
#   PROXY 출발지가 **루프백**이면 Envoy 는 그 대신 자기 주소(호스트의 첫 비 루프백 주소 — cp1 은 10.10.10.20)를 덧붙인다(conn_manager_utility.cc
#   appendXff). LB 흉내(haproxy)에 127.0.0.1 로 붙는 시험에서만 생긴다 — prod 의 SE 는 PC 주소를 싣는다. 보존 범위는 보안 S2.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dms-portal
  namespace: dms
spec:
  concurrency: 2
  extraArgs:
    - --disable-hot-restart
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyService:
        type: ClusterIP
      envoyDaemonSet:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
        pod:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        container:
          image: set-by-overlay.invalid/envoy:distroless-v1.39.5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
                  containers:
                    - name: envoy
                      imagePullPolicy: IfNotPresent
                    - name: shutdown-manager
                      image: set-by-overlay.invalid/gateway:v1.9.3
                      imagePullPolicy: IfNotPresent
  telemetry:
    # prometheus stats 리스너(:19001) 끔(2026-11-03 커밋 보안 리뷰): hostNetwork 라 마스터 호스트의 모든 인터페이스에 열린다 — DMS 는
    # 이 지표를 쓰지 않는다. 남는 :19003(readiness — kubelet 이 노드 자신에서 probe)·:19002(shutdown-manager — /shutdown/ready 대기 GET
    # 뿐, drain 은 envoy 컨테이너의 localhost admin :19000)은 마스터 방화벽에서 노드 밖을 막는다(deploy/README §2g, 설계 4-2: :443 만 SE 대역).
    metrics:
      prometheus:
        disable: true
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              client_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              peer: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT%"
              x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              method: "%REQ(:METHOD)%"
              path: "%REQ_WITHOUT_QUERY(:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration_ms: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              sni: "%REQUESTED_SERVER_NAME%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
