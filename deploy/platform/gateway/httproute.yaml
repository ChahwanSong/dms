# HTTPRoute dms-portal(2026-11-03 ⑥, 설계 #14·v3 5절 ②): 모든 경로 → svc dms-api:8080(FastAPI 가 SPA + API 를 함께 준다 — 앱 구조 무변경).
# hostnames 없음(Gateway 리스너와 같은 catch-all). timeouts.request 3600s: Envoy 라우트 기본 타임아웃은 15초이고 응답이 **다 끝날 때까지**의
# 시간이라, 아티팩트 다운로드(StreamingResponse, 최대 256MiB)·사용량 내보내기처럼 저속 회선에서 길게 흐르는 응답이 15초에 끊긴다(옛 Ingress 는
# proxy-read/send-timeout 300). 1시간이면 업무 범위의 다운로드가 끝난다(v3 의 0s(무제한)를 3600s 로 바꿔 읽음 — 설계 9 ⑥).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dms-portal
  namespace: dms
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: dms-portal
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: dms-api
          port: 8080
      timeouts:
        request: 3600s
