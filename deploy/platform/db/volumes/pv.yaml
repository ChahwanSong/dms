# 정적 hostPath PV 풀 dms-pgdata-01..05(2026-11-03 ⑤, 설계 v6 6-1·6-2). 다섯 개가 이름·경로 끝자리 말고는 같다 — 셋은 인스턴스, 둘은 여분.
# 경로·용량은 사이트 중립 자리표시자다: 렌더러가 <SHARED_DIR>/dms/pgdata/dms-pgdata-0N 와 values 의 PG_STORAGE_SIZE(Cluster storage.size 와
# 같은 값)로 덮는다. 디렉터리는 S0 가 26:26 0700 + .dms-pv-id(값 = PV 이름)로 만든다 — PGDATA 는 그 아래 pgdata/ (CNPG 가 만든다).
# nodeAffinity·claimRef 를 넣지 마라(6-2 — 어느 노드에서든 같은 PGDATA, 재생성 때 자가 치유). type 은 Directory 만(경로를 만드는 타입 금지).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dms-pgdata-01
  labels:
    app.kubernetes.io/part-of: dms
    app.kubernetes.io/managed-by: dms-install
    dms.io/pg-cluster: dms-pg
spec:
  capacity:
    storage: set-by-overlay
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: dms-pg-shared
  volumeMode: Filesystem
  hostPath:
    path: /set-by-overlay.invalid/dms/pgdata/dms-pgdata-01
    type: Directory
---
