# dms-pg-shared 클래스의 PVC 는 네임스페이스 dms 에서만(2026-11-03 ⑤, 설계 6-2 「소유·보안」 권고 — 커밋 보안 리뷰가 짚어 선택에서 기본으로).
# 왜: 정적 PV 풀(dms-pgdata-01..05)은 claimRef 가 없어(재생성 자가 치유 — 6-2) 여분 PV 가 Available 로 있다. 클래스만 맞으면 어느
#   네임스페이스의 PVC 든 그 PV 에 바인딩돼, 파드가 PG 데이터 디렉터리(공용 스토리지 위 <SHARED_DIR>/dms/pgdata/…)를 붙일 수 있다 —
#   클러스터를 다른 팀과 나눠 쓰면 DMS DB(계정 해시·봉인 토큰)를 읽는 길이 된다. PV 쪽 claimRef 고정은 6-2 가 버린 길이라(재생성 때
#   자가 치유가 안 됨) PVC 생성 쪽을 막는다. 바인딩은 클래스가 같아야 하므로 클래스 이름 하나로 충분하다(spec.volumeName 으로 직접 고른
#   PVC 도 클래스가 달라 붙지 않는다). dms 안의 PVC 는 CNPG 와 관리자만 만든다.
# ValidatingAdmissionPolicy 는 1.30 GA(prod 1.34~1.36). 애드온·이미지가 필요 없다.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dms-pg-shared-pvc-namespace
  labels:
    app.kubernetes.io/part-of: dms
    app.kubernetes.io/managed-by: dms-install
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
  validations:
    - expression: >-
        !has(object.spec.storageClassName) || object.spec.storageClassName != 'dms-pg-shared'
        || object.metadata.namespace == 'dms'
      message: "storageClassName dms-pg-shared(DMS PG 볼륨)는 네임스페이스 dms 에서만 쓸 수 있다"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dms-pg-shared-pvc-namespace
  labels:
    app.kubernetes.io/part-of: dms
    app.kubernetes.io/managed-by: dms-install
spec:
  policyName: dms-pg-shared-pvc-namespace
  validationActions: [Deny]
