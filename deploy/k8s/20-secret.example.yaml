# EXAMPLE ONLY -- never `kubectl apply` this file (deploy/README.md section 3-6).
#
# The real `dms-secrets` is NEVER committed (this repo has a public GitHub remote). The installer creates it:
# `sh deploy/install.sh --context <ctx>` stage S2 runs `python3 deploy/pg-secrets.py --context <ctx> init-secrets`
# when the secret is missing -- the four keys below, random tokens, and a DMS_DATABASE_URL that points at the
# in-cluster CloudNativePG cluster `dms-pg` with the `dms-pg-app` password -- and never prints a value. This file
# only documents the key set and the shape of each value; see deploy/README.md section 3b (secrets, certificates,
# tokens -- listing, rotation) and section 2f-2 (DB URL, moving from an external DB).
#
# WHY THIS LIVES IN ITS OWN FILE: it used to be a second document inside 20-config.yaml, so every re-apply of
# the config overwrote the live secret with these placeholders and the api/controller pods went
# CrashLoopBackOff on `password authentication failed`. Splitting it out means re-applying config can no
# longer destroy credentials. Applying THIS file has the same effect -- it replaces the live secret that S2
# created (deploy/README.md section 3-6).
#
# Placeholders are rejected at startup: src/dms/config.py `_is_placeholder`
# fails loud on any value containing CHANGE_ME or REPLACE_WITH_, so applying
# this file as-is cannot silently bring the system up with a shared token
# that is published in the repo (Bearer <DMS_SHARED_TOKEN> grants admin).
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  # Shape written by deploy/pg-secrets.py build_url (password = the `dms-pg-app` secret's password; the real URL
  # also carries keepalives=1&keepalives_idle=10&keepalives_interval=5&keepalives_count=3&tcp_user_timeout=15000).
  DMS_DATABASE_URL: "postgresql://dms:CHANGE_ME_DB_PASSWORD@dms-pg-rw.dms.svc:5432/dms?sslmode=require&target_session_attrs=read-write"
  # Bearer token that grants role=admin on every API call (auth.py
  # current_identity: Bearer <DMS_SHARED_TOKEN> => Identity(role="admin")).
  # It cannot touch accounts or the build/release path (session-only routes).
  DMS_SHARED_TOKEN: "CHANGE_ME_SHARED_TOKEN"
  # POST /api/admin/accounts with the x-admin-token header creates an admin account -- not only the first one:
  # it stays valid after bootstrap, so read access to secrets in ns dms is the highest DMS privilege.
  DMS_ADMIN_TOKEN: "CHANGE_ME_ADMIN_TOKEN"
  # Signs the session cookie (SessionMiddleware) for the browser login flow; also the key material that
  # encrypts the portal-stored mail relay key and k8s tokens (rotating it means re-entering those).
  DMS_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET"
  # (No LDAP bind password: dms-k8s is k8s-identity-mode only since 2026-10-26 -- these four keys are all.)
