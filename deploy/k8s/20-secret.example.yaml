# EXAMPLE ONLY -- never `kubectl apply` this file.
#
# The real `dms-secrets` is created out-of-band at deploy time and is NEVER
# committed (this repo has a public GitHub remote). This file documents the
# key set and the shape of each value; copy it, fill it in, and apply the
# copy -- or use the `kubectl create secret generic` one-liner in
# deploy/README.md section 3b, which is the supported path.
#
# WHY THIS LIVES IN ITS OWN FILE: it used to be a second document inside
# 20-config.yaml. `kubectl apply -f deploy/k8s/20-config.yaml` -- the exact
# command in README section 3 -- then overwrote the live secret with these
# placeholders on every re-apply, and the api/controller pods went
# CrashLoopBackOff on `password authentication failed for user "dmsapp"`.
# Splitting it out means re-applying config can no longer destroy credentials.
#
# Placeholders are rejected at startup: src/dms/config.py `_is_placeholder`
# fails loud on any value containing CHANGE_ME or REPLACE_WITH_, so applying
# this file as-is cannot silently bring the system up with a shared token
# that is published in the repo (Bearer <DMS_SHARED_TOKEN> grants admin).
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  DMS_DATABASE_URL: "postgresql://dmsapp:CHANGE_ME_DB_PASSWORD@10.10.10.30:5432/dmsdb"
  # Bearer token that grants role=admin on every API call (auth.py
  # current_identity: Bearer <DMS_SHARED_TOKEN> => Identity(role="admin")).
  DMS_SHARED_TOKEN: "CHANGE_ME_SHARED_TOKEN"
  # Required only for POST /api/admin/accounts (x-admin-token header).
  DMS_ADMIN_TOKEN: "CHANGE_ME_ADMIN_TOKEN"
  # Signs the session cookie (SessionMiddleware) for the browser login flow.
  DMS_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET"
  # Testbed OpenLDAP allows ANONYMOUS simple bind + search of uidNumber/
  # gidNumber/memberUid (verified: `ldapsearch -x -H ldap://10.10.10.30:389
  # -b ou=People,dc=dms,dc=local "(uid=alice)"` returns the attrs). Empty
  # bind DN/PW -> identity_ldap.build_ldap_resolver passes user=None/
  # password=None to ldap3 (anonymous). No bind account needed.
  DMS_LDAP_BIND_DN: ""
  DMS_LDAP_BIND_PW: ""
