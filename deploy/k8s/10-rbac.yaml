# ServiceAccounts + namespaced RBAC for the three DMS workloads. All
# resources this file grants are namespace-scoped (dms) except the agent's
# ClusterRole (Nodes are cluster-scoped).
---
# dms-controller (dms controller, deploy/k8s/41-controller.yaml): the only
# process that SUBMITS work. stepper.py's JobStepper calls
# VolcanoExecutionAdapter.submit()/poll()/terminate() -- i.e. K8sClient.create/
# get/delete on Pods (preflight) and batch.volcano.sh Jobs (preview/execution/
# nsync), plus KubernetesClient.read_pod_log (pods/log) for future log-tail use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-controller
  namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dms-controller
  namespace: dms
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # execution_volcano.KubernetesClient.get() polls preflight Pods via
  # read_namespaced_pod_status -> the pods/status subresource is a SEPARATE
  # RBAC resource from pods, so it must be granted explicitly (without it the
  # stepper 403s on every poll and jobs hang in Preflight/Executing).
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # vcjob status is read via get_namespaced_custom_object (covered by jobs get
  # above), but grant jobs/status too in case the client is switched to the
  # status subresource endpoint.
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs/status"]
    verbs: ["get"]
  # Slice 13 (portal-driven rollout): RolloutWatcher (rollout_watcher.py) patches
  # the image of the three DMS workloads and reads their status/generation to
  # decide convergence (execution_volcano.KubernetesClient.patch_workload/
  # get_workload). resourceNames-scoped -- the controller has no business
  # patching arbitrary workloads in the namespace.
  #
  # get on the MAIN resource is enough and no other apps verb is granted:
  # get_workload calls read_namespaced_deployment / read_namespaced_daemon_set,
  # which read the main resource (status comes back inside it), and nothing in
  # src/dms ever lists or reads the /status subresource of an apps object. The
  # earlier `list` and `deployments/status` rules were dead. `list` in
  # particular was the ONE rule here without resourceNames, which quietly
  # widened this Role to every workload in the namespace and made the
  # "resourceNames-scoped" claim above untrue. Dropped rather than kept as
  # forward-looking: a grant that no caller exercises cannot be verified, and
  # re-adding it is one line the day something needs it. (Pod listing for
  # rollout diagnostics uses the core pods rule above, not this one.)
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    resourceNames: ["dms-api", "dms-controller", "dms-agent"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dms-controller
  namespace: dms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dms-controller
subjects:
  - kind: ServiceAccount
    name: dms-controller
    namespace: dms
---
# dms-api (dms api, deploy/k8s/40-api.yaml): builds the SAME
# VolcanoExecutionAdapter as the controller (see api/app.py
# create_app -> build_execution_adapter), but only ever calls
# .terminate() -- from POST /api/user/jobs/{id}:cancel (routes_jobs.py
# cancel_job -> adapter.terminate(ref) for each phase_refs entry). That is a
# k8s DELETE on the job's Pod/vcjob refs, so a read-only grant here would make
# every cancel fail with 500 cancel_failed. No create -- api never submits.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-api
  namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dms-api
  namespace: dms
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "delete"]
  # Slice 13: GET /api/admin/releases/targets shows the workloads' CURRENT
  # declared image (routes_releases.py -> RolloutRunner.observe ->
  # KubernetesClient.get_workload). Read-only on purpose: the mutation notes
  # above (delete for cancel, no create) are about writes, not a rule against
  # reads -- the image tag is a value the portal displays anyway. NO patch:
  # rollout is the controller's job.
  #
  # `list` was dropped for the same reason as in the controller Role: the route
  # iterates ROLLOUT_ORDER and reads each workload by name, so only get is ever
  # called. With list gone, resourceNames now applies and is worth having --
  # the three names are exactly the ones COMPONENTS can ask for, and
  # tests/test_release_manifest_contract.py pins them to the manifests.
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    resourceNames: ["dms-api", "dms-controller", "dms-agent"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dms-api
  namespace: dms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dms-api
subjects:
  - kind: ServiceAccount
    name: dms-api
    namespace: dms
---
# dms-agent (dms agent, deploy/k8s/50-agent-daemonset.yaml): current
# src/dms/agent/probes.py makes NO in-cluster API calls at all (mounts/tools/
# identities/os metrics are all local file/subprocess checks). This
# ClusterRole is a minimal, currently-UNUSED placeholder kept because it is
# called out explicitly as "nodes get, if needed" -- safe to drop later if it
# stays unused.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-agent
  namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dms-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dms-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dms-agent-readonly
subjects:
  - kind: ServiceAccount
    name: dms-agent
    namespace: dms
