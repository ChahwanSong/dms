# dms-api (`dms api` -> uvicorn serving api/app.py create_app()). Starts at
# replicas: 1 for the testbed; the app itself is stateless (DB + k8s backed)
# so this can be scaled up once the run is stable.
#
# EXCEPT: since slice 11 (portal-driven image build), replicas > 1 breaks the
# builds "at most one active build" invariant -- the guard in
# repositories/builds.py::create() is a threading.RLock on Database._lock,
# which only serializes within a single process. Two API processes can both
# pass the active() pre-check and both INSERT a Pending build. Before
# increasing replicas, add a DB-level partial unique index that enforces at
# most one row of builds with state IN ('Pending','Running').
#
# Slice 13 (portal-driven rollout) adds a SECOND invariant with the same shape:
# repositories/releases.py::create_batch() raises rollout_in_progress from an
# active() check inside the same transaction as its INSERTs, which is the same
# single-process idiom. Two API processes can both admit a rollout batch, and
# two concurrent batches racing over the same three workloads would break the
# ROLLOUT_ORDER guarantee (the watcher only ever advances the single head).
# The same partial unique index treatment is needed for releases with state IN
# ('Pending','Applying') before replicas > 1.
#
# /cephfs hostPath: app.state.execution_adapter (built in api/app.py exactly
# like the controller's) currently only ever calls .terminate() from the
# cancel route, which is DB+k8s only and needs no filesystem access. This
# mount is here for parity with the controller and forward-compatibility
# (e.g. a future artifact/log read route) per the design review; if it never
# gains a filesystem-reading route it is inert.
#
# NOTE: `type: Directory` means this pod FAILS to start on any node without a
# real /cephfs mount. That's fine as long as dms-api only schedules onto the
# w1-5 workers (all of which mount cephfs-dms per the testbed) -- if the
# cluster grows a non-cephfs worker, add a nodeSelector/affinity here (or
# switch to DirectoryOrCreate to degrade instead of failing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-api
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-api
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-api
      # 스키마 변경 배포가 자동으로 마이그레이션되도록 앱보다 먼저 dms migrate 를
      # 돌린다(슬라이스 16 설계 §2.2 -- 슬라이스 14·15는 이게 없어 실 500/수동
      # 재실행이 났다). api·controller 가 동시에 떠도 migrate() 안의 PG 어드바이저리
      # 락이 직렬화한다. one-shot Job(30-migrate-job.yaml)은 명시적 실행·복구
      # 수단으로 유지된다.
      #
      # 이미지는 본 컨테이너와 같은 태그를 유지해야 한다 -- 포탈 롤아웃 패치는 두
      # 컨테이너를 함께 갱신하지만(rollout_runner.image_patch_body), 매니페스트를
      # 손으로 고칠 때 한쪽만 바꾸면 드리프트 배지는 이를 잡지 못한다(배지는 본
      # 컨테이너만 비교한다 -- rollout_status 의 _images 가 읽는 라이브 값도
      # spec.template.spec.containers 뿐이라 매니페스트 안의 어긋남은 아예 보이지
      # 않는다). 매니페스트를 먼저 고치는 배포 관례가 이 태그의 단일 진실이고,
      # 두 이미지가 같은지는 계약 테스트(tests/test_release_manifest_contract.py)가
      # 건다 -- 손편집으로 어긋나면 배지가 아니라 그 테스트가 빨간불이 된다.
      initContainers:
        - name: migrate
          image: pkg-01:5000/dms:d79
          imagePullPolicy: IfNotPresent
          command: ["dms", "migrate"]
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: api
          image: pkg-01:5000/dms:d79
          imagePullPolicy: IfNotPresent
          command: ["dms", "api"]
          env:
            # Portal SPA static dir baked into the image (see
            # deploy/docker/Dockerfile.dms "web" stage); the image ENV
            # already sets this, listed here explicitly for visibility.
            - name: DMS_STATIC_DIR
              value: /app/static
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: cephfs
              mountPath: /cephfs
              mountPropagation: HostToContainer
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: cephfs
          hostPath:
            path: /cephfs
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: dms-api
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: dms-api
  ports:
    - name: http
      port: 8080
      targetPort: http
