# Non-secret DMS_* runtime config (dms-config) + secret DMS_* values
# (dms-secrets). Env NAMES here are cross-checked 1:1 against
# src/dms/config.py (Settings.from_env / AgentSettings.from_env) -- this is
# the new clean-slate config surface, NOT legacy's DMS_DM_*/DMS_AUTH_*
# naming.
#
# dms-secrets values below are TESTBED DEMO VALUES, not production secrets.
# DMS_LDAP_BIND_DN / DMS_LDAP_BIND_PW in particular are UNRESOLVED
# placeholders -- see deploy/README.md "Unresolved values to fill in".
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-config
  namespace: dms
data:
  # --- execution backend (wiring.py: != "volcano" falls back to the stub
  #     adapter, which never touches k8s at all) ---
  DMS_EXECUTION_BACKEND: "volcano"
  DMS_K8S_NAMESPACE: "dms"
  # Must match whatever build-and-push.sh TAG was actually pushed as.
  DMS_JOB_IMAGE: "pkg-01:5000/dms-mpifileutils:job3"

  # --- artifact storage: shared-FS path job pods/controller/api write/read
  #     summary.json under (execution_manifests.py::_artifact_dir,
  #     execution_volcano.py::_volumes) ---
  DMS_ARTIFACT_BASE_URI: "file:///cephfs/dms/artifacts"

  # --- api server bind ---
  DMS_API_HOST: "0.0.0.0"
  DMS_API_PORT: "8080"

  # --- LDAP identity resolution (identity_ldap.py) ---
  DMS_LDAP_URI: "ldap://10.10.10.30:389"
  DMS_LDAP_USER_BASE: "ou=People,dc=dms,dc=local"
  DMS_LDAP_GROUP_BASE: "ou=Groups,dc=dms,dc=local"

  # --- privileged-requester gate (routes_requests.py submit()) ---
  # 기본값: root/admin actor를 특권 요청자로 인정 → 이 id로 온 잡은 uid0/gid0(root)로
  # 실행되고 LDAP 노드-신원 검사를 건너뛴다. 게이트는 인증된 requester_id 기준이므로
  # 일반 사용자는 owner_username을 조작해도 승격 불가(403). 특권을 완전히 끄려면
  # DMS_ALLOW_PRIVILEGED_REQUESTERS="false" 또는 DMS_PRIVILEGED_REQUESTERS=""(명시적 빈값).
  DMS_ALLOW_PRIVILEGED_REQUESTERS: "true"
  DMS_PRIVILEGED_REQUESTERS: "root,admin"

  # --- controller loop intervals / retention / job-runner knobs (all have
  #     code defaults in config.py _SERVER_INT_KEYS -- set explicitly here so
  #     this ConfigMap is the single source of truth for the live testbed) ---
  DMS_AGENT_REPORT_STALE_SECONDS: "300"
  DMS_AGENT_REPORT_INTERVAL_SECONDS: "60"
  DMS_RECONCILE_INTERVAL_SECONDS: "30"
  DMS_RETENTION_INTERVAL_SECONDS: "3600"
  DMS_AGENT_REPORT_RETENTION_DAYS: "30"
  DMS_IDENTITY_PROBE_TTL_SECONDS: "3600"
  DMS_PLANNER_INTERVAL_SECONDS: "10"
  DMS_STEPPER_INTERVAL_SECONDS: "5"
  DMS_PREVIEW_TTL_SECONDS: "86400"
  # Volcano Job.spec.ttlSecondsAfterFinished -- Volcano가 완료된 vcjob을 GC하는
  # 시점(초). execution_manifests.py::_apply_ttl -- Task 5의 preflight Pod GC 루프와는
  # 별개(파드에는 이 필드가 존재하지 않는다).
  DMS_VCJOB_TTL_SECONDS: "86400"
  # preflight Pod GC(pod_gc.py) -- 종단(Terminal) 잡이 남긴 pod/pods 참조 중
  # updated_at이 AFTER_SECONDS보다 오래된 것만 매 INTERVAL_SECONDS마다 정리한다.
  # vcjob/은 대상이 아니다(위 TTL이 처리) -- 진행 중인 잡의 파드는 이 게이트로
  # 인해 절대 삭제되지 않는다(stepper 오인 방지).
  # AFTER_SECONDS는 위 DMS_VCJOB_TTL_SECONDS와 같은 86400으로 맞춘다: preflight
  # Pod은 dms_job_runner가 아니라 bare `sh -c`로 실행되어 아무 아티팩트도 쓰지
  # 않으므로, DMS_PREFLIGHT_REASON 같은 진단 정보는 파드 로그에만 존재한다 --
  # 짧은 GC 창은 운영자가 원인을 확인하기 전에 그 유일한 사본을 지워버린다.
  DMS_POD_GC_AFTER_SECONDS: "86400"
  DMS_POD_GC_INTERVAL_SECONDS: "600"

  # --- agent report cadence (AgentSettings.from_env; consumed via
  #     configMapKeyRef in 50-agent-daemonset.yaml, NOT envFrom, since the
  #     agent should only see the small env slice it actually needs) ---
  DMS_AGENT_INTERVAL_SECONDS: "30"
---
# SECURITY: this committed manifest carries ONLY non-secret placeholders. The
# real dms-secrets is created out-of-band at deploy time and is NEVER committed
# (the repo has a public GitHub remote). See deploy/README.md "Create the
# secret": `kubectl -n dms create secret generic dms-secrets --from-literal=...`
# with the real testbed DB password + freshly generated tokens. Applying this
# file's placeholders would start the pods but every DB call / auth would fail,
# which is the intended fail-loud behavior if the real secret step was skipped.
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  DMS_DATABASE_URL: "postgresql://dmsapp:CHANGE_ME_DB_PASSWORD@10.10.10.30:5432/dmsdb"
  # Bearer token that grants role=admin on every API call (auth.py
  # current_identity: Bearer <DMS_SHARED_TOKEN> => Identity(role="admin")).
  DMS_SHARED_TOKEN: "CHANGE_ME_SHARED_TOKEN"
  # Required only for POST /api/admin/accounts (x-admin-token header).
  DMS_ADMIN_TOKEN: "CHANGE_ME_ADMIN_TOKEN"
  # Signs the session cookie (SessionMiddleware) for the browser login flow.
  DMS_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET"
  # Testbed OpenLDAP allows ANONYMOUS simple bind + search of uidNumber/
  # gidNumber/memberUid (verified: `ldapsearch -x -H ldap://10.10.10.30:389
  # -b ou=People,dc=dms,dc=local "(uid=alice)"` returns the attrs). Empty
  # bind DN/PW -> identity_ldap.build_ldap_resolver passes user=None/
  # password=None to ldap3 (anonymous). No bind account needed.
  DMS_LDAP_BIND_DN: ""
  DMS_LDAP_BIND_PW: ""
