# Non-secret DMS_* runtime config (dms-config) ONLY. Env NAMES here are
# cross-checked 1:1 against src/dms/config.py (Settings.from_env /
# AgentSettings.from_env) -- this is the new clean-slate config surface, NOT
# legacy's DMS_DM_*/DMS_AUTH_* naming.
#
# Secret values (dms-secrets) are deliberately NOT in this file: it is
# re-applied on every deploy, and a placeholder Secret riding along would
# overwrite live credentials each time. See 20-secret.example.yaml and
# deploy/README.md section 3b.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-config
  namespace: dms
data:
  # --- execution backend (wiring.py: != "volcano" falls back to the stub
  #     adapter, which never touches k8s at all) ---
  DMS_EXECUTION_BACKEND: "volcano"
  DMS_K8S_NAMESPACE: "dms"
  # Must match whatever build-and-push.sh TAG was actually pushed as.
  DMS_JOB_IMAGE: "pkg-01:5000/dms-mpifileutils:d46"

  # --- artifact storage: shared-FS path job pods/controller/api write/read
  #     summary.json under (execution_manifests.py::_artifact_dir,
  #     execution_volcano.py::_volumes) ---
  DMS_ARTIFACT_BASE_URI: "file:///cephfs/dms/artifacts"
  # 아티팩트 전체 다운로드 상한(바이트). 뷰 256KB 꼬리와 별개. sparse 초대형
  # 파일 공격을 여기서 끊는다 -- 초과는 413 artifact_too_large.
  DMS_ARTIFACT_DOWNLOAD_MAX_BYTES: "268435456"

  # --- api server bind ---
  DMS_API_HOST: "0.0.0.0"
  DMS_API_PORT: "8080"

  # --- LDAP identity resolution (identity_ldap.py) ---
  DMS_LDAP_URI: "ldap://10.10.10.30:389"
  DMS_LDAP_USER_BASE: "ou=People,dc=dms,dc=local"
  DMS_LDAP_GROUP_BASE: "ou=Groups,dc=dms,dc=local"
  # 슬라이스 28: "true"면 DMS_LDAP_BIND_DN/PW(dms-secrets)가 비거나 자리표시자일 때
  # api/controller/migrate 가 기동을 거부한다(SettingsError) -- 인증 바인드를
  # 의도했는데 익명으로 조용히 도는 상태를 막는 스위치. 테스트베드 OpenLDAP 은
  # 익명 바인드를 허용하므로(20-secret.example.yaml) 바인드 계정이 준비되기
  # 전까지 "false"로 둔다 -- 전환 절차: 계정 발급 -> dms-secrets 에 DN/PW 주입
  # -> 이 값을 "true"로. 순서를 어기면 제어면 전체가 CrashLoopBackOff 다(의도된
  # 시끄러움이지만, 켜기 전에 자격증명부터).
  DMS_LDAP_REQUIRE_AUTH_BIND: "false"

  # --- privileged-requester gate (routes_requests.py submit()) ---
  # 기본값: root/admin actor를 특권 요청자로 인정 → 이 id로 온 잡은 uid0/gid0(root)로
  # 실행되고 LDAP 노드-신원 검사를 건너뛴다. 게이트는 인증된 requester_id 기준이므로
  # 일반 사용자는 owner_username을 조작해도 승격 불가(403). 특권을 완전히 끄려면
  # DMS_ALLOW_PRIVILEGED_REQUESTERS="false" 또는 DMS_PRIVILEGED_REQUESTERS=""(명시적 빈값).
  DMS_ALLOW_PRIVILEGED_REQUESTERS: "true"
  # mason: 운영자 로컬 admin 계정(LDAP 밖 — mkadmin 생성). LDAP 에 없는 계정은
  # planner 신원 해석에서 거부되므로, 특권 실행(owner_username 지정, root 실행)이
  # 이 계정으로 잡을 돌릴 유일한 경로다. planner 가 세션 인증 + 이 목록을 재검증한다.
  DMS_PRIVILEGED_REQUESTERS: "root,admin,mason"

  # --- controller loop intervals / retention / job-runner knobs (all have
  #     code defaults in config.py _SERVER_INT_KEYS -- set explicitly here so
  #     this ConfigMap is the single source of truth for the live testbed) ---
  DMS_AGENT_REPORT_STALE_SECONDS: "300"
  DMS_AGENT_REPORT_INTERVAL_SECONDS: "60"
  DMS_RECONCILE_INTERVAL_SECONDS: "30"
  DMS_RETENTION_INTERVAL_SECONDS: "3600"
  DMS_AGENT_REPORT_RETENTION_DAYS: "30"
  # 슬라이스 12: events(진단 이벤트) 테이블 보존 기간. 기본값(30)이라 미설정이어도
  # 안 깨지지만, 형제 항목(DMS_AGENT_REPORT_RETENTION_DAYS)처럼 이 파일이 실 테스트베드의
  # 단일 진실이므로 운영자가 여기서 찾을 수 있어야 한다.
  DMS_EVENT_RETENTION_DAYS: "30"
  DMS_IDENTITY_PROBE_TTL_SECONDS: "3600"
  DMS_PLANNER_INTERVAL_SECONDS: "10"
  # 슬라이스 16: 신규 사용자의 첫 요청이 노드 신원 전파(최악 ≈130s) 전에 도착하면
  # 즉시 거부하지 않고 이 시간 안에서 Pending 유예 후 재계획한다(설계 §2.3).
  # 신원 외 사유(미마운트 등)는 기존대로 즉시 거부된다.
  DMS_PLANNER_IDENTITY_GRACE_SECONDS: "300"
  DMS_STEPPER_INTERVAL_SECONDS: "5"
  DMS_PREVIEW_TTL_SECONDS: "86400"
  # Volcano Job.spec.ttlSecondsAfterFinished -- Volcano가 완료된 vcjob을 GC하는
  # 시점(초). execution_manifests.py::_apply_ttl -- Task 5의 preflight Pod GC 루프와는
  # 별개(파드에는 이 필드가 존재하지 않는다).
  DMS_VCJOB_TTL_SECONDS: "86400"
  # preflight Pod GC(pod_gc.py) -- 종단(Terminal) 잡이 남긴 pod/pods 참조 중
  # updated_at이 AFTER_SECONDS보다 오래된 것만 매 INTERVAL_SECONDS마다 정리한다.
  # vcjob/은 대상이 아니다(위 TTL이 처리) -- 진행 중인 잡의 파드는 이 게이트로
  # 인해 절대 삭제되지 않는다(stepper 오인 방지).
  # AFTER_SECONDS는 위 DMS_VCJOB_TTL_SECONDS와 같은 86400으로 맞춘다. 슬라이스 25
  # 부터 실패 종단 잡의 파드 로그(DMS_PREFLIGHT_REASON 마커·러너 트레이스백)는
  # 스테퍼가 data_jobs.diag_logs 에 박제하므로(파드당 16KB·총 64KB) 이 창은 더는
  # "유일한 사본"의 수명이 아니다 -- 라이브 로그 열람의 여유 창일 뿐이다. 값을
  # 줄일 이유도 없다: 박제는 실패 종단 잡만 덮고, 진행 중·성공 잡의 라이브
  # 열람은 여전히 이 창에 산다.
  DMS_POD_GC_AFTER_SECONDS: "86400"
  DMS_POD_GC_INTERVAL_SECONDS: "600"

  # --- agent report cadence (AgentSettings.from_env; consumed via
  #     configMapKeyRef in 50-agent-daemonset.yaml, NOT envFrom, since the
  #     agent should only see the small env slice it actually needs) ---
  DMS_AGENT_INTERVAL_SECONDS: "30"

  # --- 포탈 주도 이미지 빌드 (슬라이스 11) ---
  # 빌드 노드는 DB(control_state.build_node_name)에 있다 -- 운영자가 포탈에서 바꾸므로
  # 여기 두면 재적용마다 되돌아간다.
  DMS_BUILD_REGISTRY: "pkg-01:5000"
  # 빌더 이미지는 **로컬 레지스트리 미러**를 쓴다(슬라이스 21 실증에서 발견).
  # quay.io 를 직접 가리키면 kubelet/CRI-O 가 **노드 네트워크로** 매 빌드마다 pull 해야
  # 하는데, 적합성 프리플라이트는 **파드 네트워크로** egress 를 검사하므로 그 경로를
  # 검사하지 못한다 -- 실증에서 프로브는 통과했는데 빌드 파드가 ImagePullBackOff 로
  # 앉아 있는 상태를 실제로 만들었다(로그: quay.io:443 connection refused).
  # 미러를 쓰면 노드가 인터넷 없이도 빌더를 받고, 남는 인터넷 수요(git clone·npm·
  # PyPI·apt)가 전부 빌드 파드 안으로 모여 프로브가 검사하는 경로와 일치한다.
  # 프리플라이트의 레지스트리 검사(build_registry_unreachable)가 이 경로까지 덮는다.
  # 미러 갱신: pkg-01 에서 podman pull quay.io/buildah/stable:latest &&
  #            podman tag … pkg-01:5000/buildah:stable && podman push --tls-verify=false …
  DMS_BUILD_BUILDER_IMAGE: "pkg-01:5000/buildah:stable"
  DMS_BUILD_REPO_URL: "https://github.com/ChahwanSong/dms.git"
  DMS_BUILD_WATCHER_INTERVAL_SECONDS: "15"
  # 빌드 파드 activeDeadlineSeconds + BuildWatcher 나이 기반 회수 창(초). 빌드
  # 노드 오타로 nodeSelector가 안 맞아 파드가 영구 Pending이 되는 등, 포탈 안에서
  # 빠져나올 길이 없는 경로를 막는다 -- 기본 7200(2h)은 mpifileutils 소스 컴파일
  # 포함 3종 빌드가 가장 오래 걸리는 경우를 기준으로 잡은 여유값이다.
  DMS_BUILD_TIMEOUT_SECONDS: "7200"
  # 슬라이스 21: 빌드 적합성 프리플라이트(프로브 파드) 대기 상한(초). 프로브는
  # 캐시된 DMS_JOB_IMAGE 로 수 초면 끝난다 -- 이 창을 넘기면 노드 다운/스케줄
  # 불가로 보고 build_preflight_timeout 으로 즉시 회수한다(위 2h generic 타임아웃
  # 을 기다리지 않는다). 포탈 Pending 캡션의 "최대 약 3분"이 이 값이다.
  DMS_BUILD_PREFLIGHT_TIMEOUT_SECONDS: "180"
  # 연속 readyz 실패 자기 종료 임계(슬라이스 22). 프로브 주기 10s 기준 30 ≈ 5분.
  # 2026-08-11 에 API 가 90분간 0/1 Running 으로 방치된 사건의 처방이다 —
  # /healthz 는 DB 를 안 봐서 200 이라 kubelet 이 재시작하지 않고, readiness 503 만
  # 나 Service 에서 빠진 채로 무한정 남았다. 0 으로 두면 이 장치가 꺼진다(관찰 전용).
  DMS_READYZ_EXIT_FAILURES: "30"

  # --- 포탈 주도 롤아웃 (슬라이스 13) ---
  # 레지스트리는 빌드와 같은 것을 쓴다 -- 롤아웃 전용 레지스트리 설정은 없다.
  # 「릴리스」 화면의 태그 목록과 최종 image 문자열은 위 DMS_BUILD_REGISTRY로
  # 조립된다(routes_releases.py). 즉 이 절에 새로 넣을 키는 아래 둘뿐이다.
  # 간격 10초 -> per-loop 리스 30초. 리스는 갱신되지 않으므로 간격을 늘리면
  # 컨트롤러 자기 갱신 뒤 새 파드의 리스 재획득이 그만큼 늦어져 롤아웃 추적이
  # 몇 배로 멈춘다(설계 §2) -- 늘리기 전에 그 트레이드오프를 확인할 것.
  DMS_ROLLOUT_INTERVAL_SECONDS: "10"
  # DaemonSet 수렴의 벽시계 상한(초). DaemonSet에는 progressDeadlineSeconds가
  # 없어 이것이 유일한 실패 수단이다. Deployment는 PDE(600)가 확정하고, 이 값의
  # 3배가 최후 회수로만 쓰인다(rollout_watcher.py).
  # 참고: k8s API 호출 자체의 타임아웃(ROLLOUT_REQUEST_TIMEOUT_SECONDS=10,
  # execution_volcano.py)은 env가 아니라 코드 상수다 -- 여기에 키가 없는 게 맞다.
  DMS_ROLLOUT_TIMEOUT_SECONDS: "600"
