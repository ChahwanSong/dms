# 프로덕션 자세(2026-08-19): 서비스 VIP 를 노드와 **다른 서브넷**의 라우팅되는
# 주소로 — MetalLB BGP 모드. L2(같은 세그먼트 ARP)와 달리 노드 6대 전원이
# 라우터에 VIP 경로를 광고해 ECMP 분산·노드 장애 시 경로 자동 철회가 된다.
#
#   외부 클라이언트 → (라우터가 10.20.20.100/32 를 노드들로 라우팅, ECMP)
#     → 아무 노드 → kube-proxy → ingress-nginx → dms-api
#
# 테스트베드 리허설의 "라우터"는 luminous(게이트웨이 10.10.10.1)의 FRR 이다
# (AS 64500, listen range 10.10.10.0/24). 실환경 전환 시 peerAddress·ASN 만
# 네트워크팀 값으로 바꾼다 — 나머지(풀·광고·Ingress·TLS)는 무변경.
#
# autoAssign: false — 공인 VIP 는 귀한 자원이라 아무 LoadBalancer 서비스가
# 자동으로 물어가면 안 된다. 쓰려는 서비스가 어노테이션으로 명시 요청한다:
#   metallb.io/address-pool: dms-public-pool   (ingress-nginx svc 에 부여)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dms-public-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.20.20.100/32
  autoAssign: false
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: luminous-router
  namespace: metallb-system
spec:
  myASN: 64512
  peerASN: 64500
  peerAddress: 10.10.10.1
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: dms-public-bgp
  namespace: metallb-system
spec:
  ipAddressPools:
    - dms-public-pool
