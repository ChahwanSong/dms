# dms-controller (`dms controller`, no --once -> run_forever): hosts the
# planner/job-stepper/storage-reconciler/retention loops under a DB lease
# (controller.py build_loops/run_forever). replicas: 1 for the testbed --
# run_all_once() takes a DB lease per loop so more replicas would be safe
# (hot standby), but one is enough to validate the scenarios.
#
# The artifact-base hostPath (volume dms-artifacts) is REQUIRED (same as
# dms-api; site-neutral placeholder rendered from DMS_ARTIFACT_BASE_URI by the
# overlay's replacements -- see 40-api.yaml 「공용 디렉터리」, 2026-11-03): JobStepper calls
# execution_adapter.read_summary(ref) (stepper.py, preview + execution
# phases), which opens <DMS_ARTIFACT_BASE_URI>/<job_id>/<phase>/summary.json
# with the file:// scheme stripped (execution_volcano.py::read_summary /
# wiring.py::build_summary_reader) -- i.e. it expects that path to exist on
# the CONTROLLER'S OWN filesystem, not through the k8s API. Without this
# mount every preview/execution phase would read back None and jobs would
# stall. controller_check_once (artifact_base.py) also writes a probe file.
# The request-purge loop's trash (artifact_trash.py, <base>/.dms-trash) and
# artifact expiry also live under the base, so <SHARED_DIR>/dms/artifacts is
# the whole footprint -- the controller never needs the rest of <SHARED_DIR>.
#
# root (2026-09-09): the `controller` container runs as uid 0 with all
# capabilities dropped and a read-only image fs -- same rationale and same
# contract test as 40-api.yaml (see its header). The summary read goes
# through the same fd containment chain as the API (artifact_files.py:
# O_NOFOLLOW + S_ISREG + owner uid + nlink + realpath + 1MiB cap) because a
# requester owns <base>/<job_id>/<phase>/ and a root open() would follow a
# planted symlink straight into the requester's job detail. The `migrate`
# initContainer keeps the image USER (65532).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-controller
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-controller
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-controller
      # 40-api.yaml 의 initContainer 와 동일 -- 근거 주석은 그쪽에.
      initContainers:
        - name: migrate
          image: set-by-overlay.invalid/dms:set-by-overlay
          imagePullPolicy: IfNotPresent
          command: ["dms", "migrate"]
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: controller
          image: set-by-overlay.invalid/dms:set-by-overlay
          imagePullPolicy: IfNotPresent
          command: ["dms", "controller"]
          # root, no capabilities, immutable image fs -- rationale in the header
          # comment. Pinned by tests/test_release_manifest_contract.py.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          volumeMounts:
            # 경로는 오버레이 replacements 가 hostPath 와 같은 값으로 바꾼다(40-api.yaml 헤더 「공용 디렉터리」).
            - name: dms-artifacts
              mountPath: /set-by-overlay.invalid/dms/artifacts
              mountPropagation: HostToContainer
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: dms-artifacts
          hostPath:
            path: /set-by-overlay.invalid/dms/artifacts
            type: Directory
