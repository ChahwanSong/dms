# 포탈 프로덕션 노출(2026-08-19, 공인 VIP·L2 모드 — 사용자 결정으로 BGP 미사용):
# nginx ingress + TLS 종단.
#
#   브라우저 → https://dms.local (공인 VIP 10.20.20.100)
#     → 상위 라우팅이 VIP 를 노드 세그먼트로 배달, MetalLB L2 가 ARP 응답
#       (47-metallb-public-pool.yaml — 페일오버 실측 ~11s)
#     → ingress-nginx(v1.15.1, replicas 2)가 TLS 종단 후 이 Ingress 규칙으로
#     → svc dms-api:8080 (FastAPI 가 SPA+API 서빙 — 앱 구조 무변경)
#
# 선행 조건(클러스터에 설치돼 있어야 함, 이미지는 pkg-01:5000 미러):
#   - MetalLB v0.16.0 + 47-metallb-public-pool.yaml (공인 풀 + L2Advertisement)
#     + ingress-nginx svc 에 어노테이션 metallb.io/address-pool: dms-public-pool
#   - ingress-nginx v1.15.1 (IngressClass "nginx")
#   - TLS secret (git 에 넣지 않는다 — 개인키):
#       kubectl -n dms create secret tls dms-portal-tls --cert=tls.crt --key=tls.key
#     리허설은 자체 CA 발급(SAN: DNS dms.local + IP 10.20.20.100),
#     프로덕션은 사내 PKI 발급분으로 같은 이름만 교체.
#   - 앱: 20-config 의 DMS_SESSION_COOKIE_SECURE=true (세션 쿠키 Secure).
#     평문 NodePort(구 45-api-nodeport.yaml)는 제거됐다 — 자동화·비상 접근은
#     Bearer 토큰 또는 https://dms.local.
#
# 실환경 이관 시 바꿀 값: 47 의 VIP 주소, TLS secret(사내 PKI). 이 Ingress
# 자체는 무변경.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms-portal
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-api
    app.kubernetes.io/part-of: dms
  annotations:
    # 대량 배치 제출(항목 수천 개 JSON)이 기본 1m 바디 캡에 걸리지 않게.
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # 아티팩트 다운로드는 StreamingResponse(최대 256MiB) — 저속 회선에서 프록시가
    # 먼저 끊지 않게 읽기/보내기 타임아웃을 넉넉히.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dms.local]
      secretName: dms-portal-tls
  rules:
    - host: dms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dms-api
                port:
                  number: 8080
