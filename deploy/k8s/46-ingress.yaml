# 포탈 프로덕션 노출(2026-08-19): nginx ingress + TLS 종단.
#
#   브라우저 → https://dms.local (VIP 10.10.10.200)
#     → MetalLB(L2, dms-pool 10.10.10.200-210)가 VIP 를 ingress-nginx svc 에 부착
#     → ingress-nginx(v1.15.1)가 TLS 종단 후 이 Ingress 규칙으로
#     → svc dms-api:8080 (FastAPI 가 SPA+API 서빙 — 앱 구조 무변경)
#
# 선행 조건(클러스터에 설치돼 있어야 함 — 17d 전 설치 확인, 이미지는 pkg-01:5000 미러):
#   - MetalLB v0.16.0 (metallb-system ns, IPAddressPool dms-pool + L2Advertisement)
#   - ingress-nginx v1.15.1 (ingress-nginx ns, IngressClass "nginx")
#   - TLS secret (git 에 넣지 않는다 — 개인키):
#       kubectl -n dms create secret tls dms-portal-tls --cert=tls.crt --key=tls.key
#     리허설은 자체 CA 발급(SAN: DNS dms.local + IP 10.10.10.200),
#     프로덕션은 사내 PKI 발급분으로 같은 이름만 교체.
#
# ── 프로덕션(다른 서브넷의 라우팅되는 공인 VIP) 전환 노트 ─────────────────
# L2 모드는 같은 브로드캐스트 도메인에서만 ARP 응답하므로 그대로 못 쓴다. 두 길:
#   a) MetalLB BGP 모드(정석): BGPPeer + BGPAdvertisement 로 노드들이 VIP 를
#      광고 — 네트워크팀 피어링 협조 필요, 페일오버·ECMP 자동.
#   b) 라우터 static route(VIP → 노드 IP) + 현행 L2: 간단하지만 next-hop 노드
#      장애 시 라우팅 수동 전환 — 임시 구성으로만.
# 이 Ingress 자체와 TLS secret 은 어느 모드든 무변경이다.
# 앱 쪽: TLS 로만 접속하는 배포에선 20-config 에 DMS_SESSION_COOKIE_SECURE=true 를
# 켜 세션 쿠키에 Secure 를 붙인다(테스트베드는 NodePort 30080 평문 경로가 살아
# 있어 기본 false). 45-api-nodeport.yaml(평문 백도어)은 프로덕션에서 제외한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms-portal
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-api
    app.kubernetes.io/part-of: dms
  annotations:
    # 대량 배치 제출(항목 수천 개 JSON)이 기본 1m 바디 캡에 걸리지 않게.
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # 아티팩트 다운로드는 StreamingResponse(최대 256MiB) — 저속 회선에서 프록시가
    # 먼저 끊지 않게 읽기/보내기 타임아웃을 넉넉히.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dms.local]
      secretName: dms-portal-tls
  rules:
    - host: dms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dms-api
                port:
                  number: 8080
