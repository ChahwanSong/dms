apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-api
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-planner
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-dm-worker
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-agent
  namespace: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-runtime-config
  namespace: dms
data:
  DMS_WORKER_LEASE_SECONDS: "300"
  DMS_PREVIEW_TTL_SECONDS: "86400"
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-database-urls
  namespace: dms
type: Opaque
stringData:
  DMS_DATABASE_URL: postgresql://dms_app:change-me@operational-postgresql.dms.svc.cluster.local:5432/dms
  DMS_OBSERVABILITY_DATABASE_URL: postgresql://dms_obs:change-me@observability-postgresql.dms.svc.cluster.local:5432/dms_observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-api
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-api
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-api
      containers:
        - name: api
          image: ghcr.io/example/dms:phase1
          imagePullPolicy: IfNotPresent
          command: ["dms", "api", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-database-urls
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: dms-api
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: dms-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-planner
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-planner
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-planner
      containers:
        - name: planner
          image: ghcr.io/example/dms:phase1
          imagePullPolicy: IfNotPresent
          command: ["dms", "planner", "--loop", "--interval", "5"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-database-urls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-dm-worker
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-dm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-dm-worker
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: dm
    spec:
      serviceAccountName: dms-dm-worker
      nodeSelector:
        dms.io/worker-role: dm
      containers:
        - name: dm-worker
          image: ghcr.io/example/dms:phase1
          imagePullPolicy: IfNotPresent
          command: ["dms", "dm-worker", "--worker-id", "$(NODE_NAME)", "--loop", "--interval", "5"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-database-urls
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dms-dm-agent-report
  namespace: dms
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dms-agent
            app.kubernetes.io/part-of: dms
            dms.io/worker-role: dm
        spec:
          restartPolicy: OnFailure
          serviceAccountName: dms-agent
          nodeSelector:
            dms.io/worker-role: dm
          containers:
            - name: agent-submit
              image: ghcr.io/example/dms:phase1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  cat >/tmp/report.json <<EOF
                  {
                    "cluster_name": "dms-cluster",
                    "node_name": "${NODE_NAME}",
                    "node_uid": "${NODE_UID}",
                    "worker_role": "DM",
                    "mounts": [],
                    "csi": [],
                    "tools": ["dsync", "drm", "dscan"],
                    "credentials": [],
                    "networks": [],
                    "identity_evidence": {}
                  }
                  EOF
                  dms agent-submit --actor "node:dms-cluster:${NODE_NAME}" --report-json /tmp/report.json
              envFrom:
                - configMapRef:
                    name: dms-runtime-config
                - secretRef:
                    name: dms-database-urls
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: NODE_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
