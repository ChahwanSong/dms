apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-rm-worker
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-agent
  namespace: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-runtime-config
  namespace: dms
data:
  DMS_WORKER_LEASE_SECONDS: "300"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-cluster-identity
  namespace: dms
data:
  cluster_name: managed-cluster
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-database-urls
  namespace: dms
type: Opaque
stringData:
  DMS_DATABASE_URL: postgresql://dms_app:change-me@dms-control-plane.example.internal:5432/dms
  DMS_OBSERVABILITY_DATABASE_URL: postgresql://dms_obs:change-me@dms-control-plane.example.internal:5432/dms_observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-rm-worker
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-rm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-rm-worker
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: rm
    spec:
      serviceAccountName: dms-rm-worker
      nodeSelector:
        dms.io/worker-role: rm
      containers:
        - name: rm-worker
          image: ghcr.io/example/dms:phase1
          imagePullPolicy: IfNotPresent
          command: ["dms", "rm-worker", "--worker-id", "$(CLUSTER_NAME)-$(NODE_NAME)", "--loop", "--interval", "5"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-database-urls
          env:
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: dms-cluster-identity
                  key: cluster_name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dms-rm-agent-report
  namespace: dms
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dms-agent
            app.kubernetes.io/part-of: dms
            dms.io/worker-role: rm
        spec:
          restartPolicy: OnFailure
          serviceAccountName: dms-agent
          nodeSelector:
            dms.io/worker-role: rm
          containers:
            - name: agent-submit
              image: ghcr.io/example/dms:phase1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  cat >/tmp/report.json <<EOF
                  {
                    "cluster_name": "${CLUSTER_NAME}",
                    "node_name": "${NODE_NAME}",
                    "node_uid": "${NODE_UID}",
                    "worker_role": "RM",
                    "mounts": [],
                    "csi": [],
                    "tools": [],
                    "credentials": [],
                    "networks": [],
                    "identity_evidence": {}
                  }
                  EOF
                  dms agent-submit --actor "node:${CLUSTER_NAME}:${NODE_NAME}" --report-json /tmp/report.json
              envFrom:
                - configMapRef:
                    name: dms-runtime-config
                - secretRef:
                    name: dms-database-urls
              env:
                - name: CLUSTER_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: dms-cluster-identity
                      key: cluster_name
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: NODE_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
