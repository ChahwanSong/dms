# 프록시 네임스페이스 PSA privileged(2026-11-03 ⑥, 설계 4-3·8-1 S8·S1 승인 항목). EG 는 Envoy 파드를 컨트롤러 네임스페이스에 만든다(기본
# 배치 모드) — DMS EnvoyProxy 가 hostNetwork 를 켜므로(443 직접 bind) baseline 이상이면 DaemonSet 파드가 admission 에서 거절된다.
# C 경로(남이 설치한 EG)에서는 이 패치를 적용하지 않는다 — 그 EG 의 네임스페이스 PSA 가 hostNetwork 를 허용하는지 감지가 본다(8-2).
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
