# ingress-nginx (helm chart) 값 — SSC "웹 노드 hostNetwork 엣지" 모드(2026-08-30).
#
# 이 모드는 MetalLB 를 쓰지 않는다. public IP 는 웹 노드 호스트 NIC 에 직접 설정돼
# 있고(사용자 검증 완료), 커널이 그 IP 의 ARP 를 담당한다 — LB 광고 장치가 불필요.
# 컨트롤러를 그 노드에 고정(nodeSelector)하고 hostNetwork 로 호스트 포트를 직접
# 리슨해, 사용자가 https://<public IP>:<PORT> 로 바로 닿게 한다(PORT 는 방화벽이
# 연 포트 -- 아래 containerPort.https, 예 30080. 표준 443 이면 그 블록 삭제).
#
# 설치:
#   kubectl label node <웹노드> dms.io/web-node=true
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     -n ingress-nginx --create-namespace \
#     -f deploy/addons/ingress-nginx/values-hostnetwork.yaml
#   (사내망 airgap: --set controller.image.registry=<사내레지스트리> 로 이미지 미러 지정)
#
# 트레이드오프(정직히): 웹 노드가 단일 장애점이다. 그 노드가 죽으면 포탈 접근이
# 끊긴다(제어면·잡은 계속 돎). 이중화가 필요해지면 웹 노드 2대 + VIP(MetalLB/
# keepalived)로 되돌아가면 된다 — 그때는 overlays/prod(MetalLB) 경로를 쓴다.
controller:
  kind: Deployment
  replicaCount: 1                      # 웹 노드 1대 — hostNetwork 라 노드당 1 파드
  hostNetwork: true                    # 호스트 포트 직접 리슨(Service LB 불필요; 포트는 아래 containerPort)
  dnsPolicy: ClusterFirstWithHostNet   # 필수: 없으면 호스트 DNS 로 dms-api.dms.svc 해석 실패(최다 함정)
  nodeSelector:
    dms.io/web-node: "true"            # public IP 가 있는 웹 노드에 고정
  # 웹 노드를 전용으로 비워두려면(선택): 노드에 taint 를 걸고 아래 toleration 을 켠다
  #   kubectl taint node <웹노드> dms.io/web-node=true:NoSchedule
  tolerations:
    - key: dms.io/web-node
      operator: Exists
      effect: NoSchedule
  service:
    enabled: true
    type: ClusterIP                    # LoadBalancer/MetalLB 불필요 — 노출은 hostNetwork 가 한다
  ingressClassResource:
    name: nginx                        # base Ingress(46) 가 ingressClassName: nginx 를 씀 — 이름 유지
    default: false
  extraArgs:
    # IP 직접(SNI 없음) https 접속도 정식 인증서를 받게 하는 짝(46-ingress 주석 참조).
    default-ssl-certificate: dms/dms-portal-tls
  # 호스트 리슨 포트. hostNetwork 라 containerPort 값이 곧 호스트 포트다(NodePort
  # 30000-32767 제약 없음). 방화벽이 연 HTTPS 포트에 맞춘다 -- 아래는 30080 예시로,
  # values.env 의 PORTAL_PORT 와 반드시 같아야 install.sh 게이트를 통과한다.
  # 표준 443 을 쓰면 이 블록을 지우면 된다(차트 기본이 80/443).
  containerPort:
    http: 80
    https: 30080        # ← 방화벽이 연 포트로. 사용자 접속: https://<public IP>:30080
  # 웹 노드에 내부 IP 도 따로 있어 그쪽 노출이 싫으면 public IP 만 바인딩:
  #   config: { bind-address: "<public IP>" }
  admissionWebhooks:
    enabled: true
