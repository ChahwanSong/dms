apiVersion: v1
kind: Namespace
metadata:
  name: dms-portal
---
apiVersion: v1
kind: Secret
metadata:
  name: portal-secrets
  namespace: dms-portal
type: Opaque
stringData:
  # All values here are PLACEHOLDERS. Never commit working credentials — inject
  # the real values into the LIVE Secret out-of-band, e.g.:
  #   kubectl -n dms-portal patch secret portal-secrets --type merge -p \
  #     '{"stringData":{"PORTAL_SESSION_SECRET":"<rand>","PORTAL_OPERATOR_USERS":"admin:<pw>","PORTAL_DMS_TOKEN":"<tok>","PORTAL_ADMIN_TOKEN":"<admin-tok>","PORTAL_DB_URL":"<dms-db-url>","PORTAL_SMTP_USER":"<mail-account>","PORTAL_SMTP_PASSWORD":"<app-password>"}}'
  #   kubectl -n dms-portal rollout restart deploy/dms-portal
  # (kubectl apply overwrites these back to placeholders, so re-patch after apply.)
  #
  # Signs the session cookie (cookie-forgery key) — use a strong random value.
  PORTAL_SESSION_SECRET: "REPLACE_WITH_SESSION_SECRET"
  # Operator credential store (operator-only id/pw login). Format: user:pw,user2:pw2
  # Once PORTAL_DB_URL is set the operator store is seeded into the DB on first
  # boot (when empty); thereafter the DB is the source of truth for logins.
  PORTAL_OPERATOR_USERS: "REPLACE_WITH_OPERATOR_CREDS"
  # DMS API bearer token (testbed auth profile).
  PORTAL_DMS_TOKEN: "REPLACE_WITH_DMS_TOKEN"
  # Shared operational secret for the LOGIN-SCREEN account flows: entering this
  # token there enables '계정 만들기'(create operator) and '비밀번호 재설정'(reset).
  # Verified server-side per request (never stored in the browser). SEPARATE from
  # PORTAL_DMS_TOKEN. Empty => those flows are hidden/disabled (normal login only).
  # Use a strong random value; rotate independently of the DMS token.
  PORTAL_ADMIN_TOKEN: "REPLACE_WITH_ADMIN_TOKEN"
  # Portal's OWN Postgres (operator logins + data-backup batches/requests). On the
  # testbed this is the DMS Postgres with a dedicated `portal` schema, so the
  # value equals dms-secrets/DMS_DATABASE_URL. Empty => no DB: login falls back to
  # the env store above and the data-backup tab is disabled (routes 503).
  PORTAL_DB_URL: "REPLACE_WITH_DB_URL"
  # SMTP relay for the end-user 계정 만들기 / 비밀번호 재설정 verification mail.
  # Gmail: PORTAL_SMTP_USER is the full address and PORTAL_SMTP_PASSWORD is a
  # 16-char APP PASSWORD (2-step verification required) — never the account
  # password. Empty => code requests fail closed (503) and self-signup is
  # unavailable; everything else keeps working.
  PORTAL_SMTP_USER: "REPLACE_WITH_SMTP_USER"
  PORTAL_SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-portal
  namespace: dms-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-portal
        app.kubernetes.io/part-of: dms-portal
    spec:
      containers:
        - name: portal
          image: registry.example.internal/dms-portal:CHANGE_ME
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            # Testbed is served over a plain-HTTP NodePort, so the session cookie
            # must NOT be Secure-only (default is true / fail-closed). Set true
            # once the portal is fronted by TLS.
            - name: PORTAL_SESSION_HTTPS_ONLY
              value: "false"
            # DMS API — the portal is a trusted in-cluster BFF, so it talks to the
            # INTERNAL token-gated plane (dms-api-internal), NOT the external mTLS
            # dms-api. The external API derives the actor from the client cert
            # (mtls:<subject>) and rejects the plaintext x-dms-actor the BFF uses to
            # carry per-operator identity; the internal plane trusts it (shared token +
            # NetworkPolicy). Same as the node agents. See install/kubernetes/
            # dms-api-internal.yaml + dms-06 §1/§8.
            - name: PORTAL_DMS_API_URL
              value: "http://dms-api-internal.dms.svc.cluster.local"
            # Default DMS audit actor; the BFF overrides per-request with the
            # logged-in operator's username.
            - name: PORTAL_DMS_ACTOR
              value: "operator"
            # --- end-user accounts (회사메일 인증) -------------------------
            # The id a user signs up with is the local part of their company mail,
            # and the verification code goes to <id>@PORTAL_EMAIL_DOMAIN. Set this
            # to the company mail domain at install time (gmail.com is only for the
            # pre-integration test). Empty => the whole self-signup flow is off.
            - name: PORTAL_EMAIL_DOMAIN
              value: "gmail.com"
            - name: PORTAL_SMTP_HOST
              value: "smtp.gmail.com"
            - name: PORTAL_SMTP_PORT
              value: "587"
            - name: PORTAL_SMTP_SECURITY
              value: "starttls"
            # While the domain is a PUBLIC one (gmail.com), keep this list filled:
            # an empty allowlist means "anyone with an account on that mail provider
            # may sign up", and a signed-up user can run DMS data jobs. Comma-separated
            # local parts. Clear it once PORTAL_EMAIL_DOMAIN is the company domain.
            - name: PORTAL_SIGNUP_ALLOWLIST
              value: "skychahwan"
          envFrom:
            - secretRef:
                name: portal-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dms-portal
  namespace: dms-portal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dms-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      # Desktop access: http://<portal-node-ip>:30090
      nodePort: 30090
