[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dms"
version = "0.1.0"
description = "DMS - data management service (clean-slate)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
ldap = ["ldap3>=2.9"]
# 하한 36 은 임의가 아니다: KubernetesClient.patch_workload 가 넘기는 `_content_type`
# kwarg 가 36.0.0 에서 도입됐다. 이 머신의 실 패키지 두 벌로 실증했다 --
# 35.0.0 의 patch_namespaced_deployment/daemon_set 은 all_params 에 `_content_type`
# 이 없어 호출 즉시 ApiTypeError("unexpected keyword argument '_content_type'") 로
# 죽는다(모든 롤아웃이 첫 패치에서 실패한다). 36.0.2 에는 있고
# `local_var_params.get('_content_type', ...)` 으로 소비된다.
# 그렇다고 kwarg 를 생략할 수도 없다: 기본값이 application/json-patch+json(RFC 6902,
# 최상위 배열 기대)이라 strategic merge 본문이 apiserver 422 로 거절된다.
# 되돌리려면 먼저 대상 버전의 all_params 에 `_content_type` 이 있는지 확인할 것.
kubernetes = ["kubernetes>=36"]

[project.scripts]
dms = "dms.cli:main"
dms-job-runner = "dms_job_runner.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:fastapi.*:",
    "ignore::DeprecationWarning:starlette.*:",
    # starlette.testclient가 import 시점에 발하는 StarletteDeprecationWarning은
    # UserWarning의 서브클래스라 위 DeprecationWarning 규칙에 걸리지 않는다.
    # fastapi.testclient -> starlette.testclient 임포트 체인에서만 발생하는
    # upstream 경고이므로 그 경로로 범위를 좁혀 무시한다.
    "ignore::starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient:",
]
