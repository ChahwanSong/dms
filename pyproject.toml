[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dms"
version = "0.1.0"
description = "DMS - data management service (clean-slate)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
ldap = ["ldap3>=2.9"]
kubernetes = ["kubernetes>=30"]

[project.scripts]
dms = "dms.cli:main"
dms-job-runner = "dms_job_runner.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:fastapi.*:",
    "ignore::DeprecationWarning:starlette.*:",
    # starlette.testclient가 import 시점에 발하는 StarletteDeprecationWarning은
    # UserWarning의 서브클래스라 위 DeprecationWarning 규칙에 걸리지 않는다.
    # fastapi.testclient -> starlette.testclient 임포트 체인에서만 발생하는
    # upstream 경고이므로 그 경로로 범위를 좁혀 무시한다.
    "ignore::starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient:",
]
