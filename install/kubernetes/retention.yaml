# agent_reports history retention.
#
# At 100+ worker nodes each reporting ~1/min, `agent_reports` grows by hundreds of
# thousands of rows per day into the millions. Node-health reads go through the
# denormalized `agent_node_current` table (latest report per node, written
# transactionally on every ingest), so the history table is needed only for the node-
# metrics time-series window — which makes age-based pruning safe.
#
# This loop deletes agent_reports older than DMS_AGENT_REPORT_RETENTION_SECONDS in
# batches (each its own transaction), bounding table size and index bloat.
#
# Self-healing (mirrors dms-sanity-reconciler):
#   * Heartbeat-driven livenessProbe — each cycle writes a heartbeat file; if the loop
#     hangs the heartbeat goes stale and the kubelet restarts the pod.
#   * Stateless + idempotent — a restart resumes with a full age-based pass.
#   * replicas: 1 (singleton). Pruning is pure age-based DELETE; if you ever run >1
#     replica they just race harmlessly over disjoint id chunks.
#   * It is an OPTIMISATION, not a correctness dependency: if it stops, reads keep
#     working over a larger table until it is restarted.
#
# The retention window is FLOORED to >= 7 days at config parse time so it can never be
# set below the 72h node-metrics sparkline window.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-retention
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-retention
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-retention
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-retention
    spec:
      serviceAccountName: dms-planner
      containers:
        - name: retention
          image: registry.example.internal/dms:CHANGE_ME
          command: ["dms", "retention", "--loop", "--interval", "3600"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          env:
            - name: DMS_AGENT_REPORT_RETENTION_HEARTBEAT_PATH
              value: /tmp/dms-retention.heartbeat
            - name: DMS_AGENT_REPORT_RETENTION_INTERVAL_SECONDS
              value: "3600"
            - name: DMS_AGENT_REPORT_RETENTION_SECONDS
              value: "2592000" # 30 days (floored to >= 7 days)
          livenessProbe:
            # Heartbeat freshness: fail (→ restart) if no cycle completed in ~2 intervals.
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/dms-retention.heartbeat 2>/dev/null || echo 0) )) -lt 7200
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
