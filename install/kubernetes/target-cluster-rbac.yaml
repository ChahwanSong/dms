# Read-only DMS access to a TARGET cluster.
#
# DMS reads each registered cluster's inventory (nodes, namespaces, StorageClasses,
# CSI drivers) to validate storage mappings — it does NOT create or mutate anything
# on the target cluster. Apply this with kubectl pointed AT the target cluster, then
# mint a kubeconfig for the dms-remote SA with
# install/scripts/create-serviceaccount-kubeconfig.sh (see install/dms-03-storage-mappings.md §3).
#
# UPGRADE NOTE (renamed from dms-remote-resource-management): clusters provisioned by
# an earlier release still carry the OLD ClusterRole/ClusterRoleBinding
# `dms-remote-resource-management`, which also granted resourcequotas write and
# namespaces create/patch/update. `kubectl apply` of this file does NOT remove it —
# it is now orphaned and must be deleted MANUALLY on every already-provisioned
# target cluster:
#   kubectl delete clusterrolebinding dms-remote-resource-management --ignore-not-found
#   kubectl delete clusterrole        dms-remote-resource-management --ignore-not-found
apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-remote
  namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dms-remote-inventory
rules:
  # Inventory reads only. `namespaces` read stays because inventory reports them;
  # no create/patch/update — DMS never provisions namespaces.
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list"]
  # StorageClass + CSIDriver reads back the storage-mapping sanity check
  # (storage_class_missing / csi_driver_mismatch).
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dms-remote-inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dms-remote-inventory
subjects:
  - kind: ServiceAccount
    name: dms-remote
    namespace: dms
