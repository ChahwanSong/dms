apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-rm-worker
  namespace: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-runtime-config
  namespace: dms
data:
  DMS_WORKER_LEASE_SECONDS: "300"
  DMS_FILESYSTEM_MUTATION_MODE: "local"
  DMS_FILESYSTEM_EXEC_TIMEOUT_SECONDS: "300"
  DMS_FILESYSTEM_EXEC_USE_SUDO: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  DMS_DATABASE_URL: "postgresql://dms_app:CHANGE_ME@postgres.example.internal:5432/dms"
  DMS_OBSERVABILITY_DATABASE_URL: "postgresql://dms_obs:CHANGE_ME@postgres.example.internal:5432/dms_observability"
  DMS_AUTH_SHARED_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
  DMS_LDAP_URI: "ldap://ldap.example.internal:389"
  DMS_LDAP_BASE_DN: "dc=example,dc=internal"
  DMS_LDAP_BIND_DN: "cn=dms,ou=service-accounts,dc=example,dc=internal"
  DMS_LDAP_BIND_PASSWORD: "CHANGE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-rm-worker-local
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-rm-worker-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-rm-worker-local
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: rm
    spec:
      serviceAccountName: dms-rm-worker
      nodeSelector:
        dms.io/rm-storage-node: "true"
      containers:
        - name: rm-worker
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "rm-worker", "--worker-id", "$(POD_NAME)", "--loop", "--interval", "5"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: cephfs-a
              mountPath: /mnt/cephfs-rwx
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: cephfs-a
          hostPath:
            path: /mnt/cephfs-rwx
            type: Directory
