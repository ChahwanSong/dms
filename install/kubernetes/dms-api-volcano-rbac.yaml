# Read-only RBAC for dms-api ServiceAccount to query Volcano resources.
# Apply out-of-band: kubectl apply -f install/kubernetes/dms-api-volcano-rbac.yaml
#
# Grants the dms-api SA (namespace: dms) read access to:
#   - queues.scheduling.volcano.sh   (cluster-scoped)
#   - jobs.batch.volcano.sh / vcjob  (namespaced)
#   - pods                           (for scheduler health in volcano-system)
#   - pods/log                       (tail MPI launcher logs for GET /operations/data-jobs/{id}/logs)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dms-api-volcano-read
rules:
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["queues"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # pods/log: read launcher-pod logs for the data-job log-tail endpoint (read-only).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dms-api-volcano-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dms-api-volcano-read
subjects:
  - kind: ServiceAccount
    name: dms-api
    namespace: dms
