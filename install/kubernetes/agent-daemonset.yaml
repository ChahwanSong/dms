apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-agent
  namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dms-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dms-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dms-agent-readonly
subjects:
  - kind: ServiceAccount
    name: dms-agent
    namespace: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-agent-runtime-config
  namespace: dms
data:
  DMS_AGENT_API_URL: "http://dms-api-internal.dms.svc.cluster.local:80"
  DMS_AGENT_CLUSTER_NAME: "cluster-a"
  DMS_AGENT_REPORT_INTERVAL_SECONDS: "60"
  DMS_AGENT_REPORT_TIMEOUT_SECONDS: "5"
  DMS_AGENT_TOOLS: "dsync,nsync,drm,dscan,kubectl"
  # REQUIRED for mount readiness. The agent runs in a container, so its own
  # /proc/self/mountinfo (the default) shows only the CONTAINER's mounts — never the
  # worker node's storage mounts (cephfs/gpfs/weka), so every mount probes as Missing
  # and RM/DM readiness is false. Point it at the HOST init's mount table, bind-mounted
  # into the pod at /host/proc/1/mountinfo (see the DaemonSet volumes below). With this,
  # the agent reads the host's real mounts and infers Ready + rw/ro from mountinfo — no
  # per-storage hostPath mounts needed.
  DMS_AGENT_MOUNTINFO_PATH: "/host/proc/1/mountinfo"
  # Host root filesystem bind-mounted at /host (see DaemonSet volumes). Enables
  # per-node disk-usage metrics + per-mount capacity (statvfs). Optional for
  # readiness (that comes from mountinfo) but part of the complete node report.
  DMS_AGENT_HOST_ROOT: "/host"
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-agent-secrets
  namespace: dms
type: Opaque
stringData:
  DMS_AUTH_SHARED_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-agent-storages
  namespace: dms
data:
  # BOOTSTRAP seed only. dms-api OVERWRITES this ConfigMap from the registered storage
  # mappings on every storage create/update/delete (requires the dms-agent-storages-sync
  # RBAC in control-plane.yaml). Agents read it once at startup, so after a mapping change
  # the DaemonSets must be restarted (POST /api/v1/agent/rollout-restart or kubectl rollout
  # restart). For a filesystem storage, mount_paths MUST list the HOST mount point(s) so
  # the agent can probe mount readiness (a CSI storage with mount_paths [] never goes Ready
  # and is namespace-quota only -- not a valid DM/filesystem-RM target).
  storages.json: |
    {
      "storages": [
        {
          "storage_name": "cephfs-a",
          "backend_type": "cephfs",
          "cluster_name": "cluster-a",
          "mount_paths": ["/cephfs"],
          "network_endpoints": []
        }
      ]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dms-rm-agent
  namespace: dms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-rm-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-rm-agent
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: rm
    spec:
      serviceAccountName: dms-agent
      containers:
        - name: agent
          # RM agent: the plain `dms` image is fine (RM readiness = mounts + can-i, no
          # mpifileutils tools). The dms-dm-agent below MUST use the dms-agent image.
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "agent-loop"]
          envFrom:
            - configMapRef:
                name: dms-agent-runtime-config
            - secretRef:
                name: dms-agent-secrets
          env:
            - name: DMS_AGENT_WORKER_ROLE
              value: RM
            - name: DMS_AGENT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DMS_AGENT_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DMS_AGENT_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: storages
              mountPath: /etc/dms/agent
              readOnly: true
            # Host root (for disk metrics / per-mount capacity). `/proc` is a
            # separate mount so it is NOT visible under this; hence the explicit
            # proc-mountinfo mount below.
            - name: host-root
              mountPath: /host
              readOnly: true
            # The host init's mount table (DMS_AGENT_MOUNTINFO_PATH). Without this
            # the agent sees only container mounts and every storage probes Missing.
            - name: proc-mountinfo
              mountPath: /host/proc/1/mountinfo
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: storages
          configMap:
            name: dms-agent-storages
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: proc-mountinfo
          hostPath:
            path: /proc/1/mountinfo
            type: File
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dms-dm-agent
  namespace: dms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-dm-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-dm-agent
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: dm
    spec:
      serviceAccountName: dms-agent
      containers:
        - name: agent
          # DM agent MUST use the dms-AGENT image (built from install/docker/Dockerfile.agent),
          # which layers the mpifileutils tools (dsync/dscan/drm/nsync) onto PATH. The agent
          # probes for them with `which`; on the plain `dms` image they are ABSENT, so every
          # DM candidate node is rejected (missing_dscan/dsync/drm_tool) and DM jobs never
          # schedule. (The dms-rm-agent above uses the plain `dms` image -- RM does not gate
          # on tools.) Build the job image first, then build this agent image with
          # --build-arg MFU_IMAGE=<job image> so the agent's tools match the job's.
          image: registry.example.internal/dms-agent:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "agent-loop"]
          envFrom:
            - configMapRef:
                name: dms-agent-runtime-config
            - secretRef:
                name: dms-agent-secrets
          env:
            - name: DMS_AGENT_WORKER_ROLE
              value: DM
            # Comma-separated POSIX usernames this DM node vouches identity-readiness for.
            # A DM job's requester MUST appear here (per node) or the candidate is rejected
            # (identity_not_ready_on_node) -- so every non-privileged DM job fails until it
            # is set. The listed users must also resolve on the node via NSS/SSSD (getpwnam)
            # so the agent can confirm uid/gid. Privileged-root jobs bypass this gate.
            - name: DMS_AGENT_IDENTITY_USERS
              value: "CHANGE_ME_user1,CHANGE_ME_user2"
            - name: DMS_AGENT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DMS_AGENT_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DMS_AGENT_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: storages
              mountPath: /etc/dms/agent
              readOnly: true
            # Host root (for disk metrics / per-mount capacity). `/proc` is a
            # separate mount so it is NOT visible under this; hence the explicit
            # proc-mountinfo mount below.
            - name: host-root
              mountPath: /host
              readOnly: true
            # The host init's mount table (DMS_AGENT_MOUNTINFO_PATH). Without this
            # the agent sees only container mounts and every storage probes Missing.
            - name: proc-mountinfo
              mountPath: /host/proc/1/mountinfo
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: storages
          configMap:
            name: dms-agent-storages
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: proc-mountinfo
          hostPath:
            path: /proc/1/mountinfo
            type: File
