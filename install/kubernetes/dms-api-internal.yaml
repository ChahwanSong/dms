# Internal-only DMS API instance for TRUSTED IN-CLUSTER CLIENTS (node agents + portal BFF).
#
# WHY: the external dms-api runs the production mTLS profile
# (DMS_REQUIRE_MTLS_VERIFIED_HEADER=true), where the authenticated actor is derived from
# the client certificate subject (`mtls:<subject>`) and a plaintext `x-dms-actor` is
# rejected. Two in-cluster clients cannot live with that:
#   - Node agents must authenticate as `node:{cluster}:{node}` (AgentReportIngestionService
#     requires the actor to equal the reported node) — no cert subject ever equals that.
#   - The portal BFF is multi-operator and carries per-operator identity in `x-dms-actor`
#     (`mtls:<operator>`); one BFF cert would collapse everyone to a single actor.
# So agent reports (node health, readiness, on-demand identity probing) AND the portal
# have no workable auth path against the mTLS API.
#
# This is a SECOND API process that skips mTLS and instead trusts an in-cluster shared
# bearer token + the client-supplied `x-dms-actor`. It is reachable ONLY from the agent
# DaemonSets and the portal namespace (NetworkPolicy below) via a ClusterIP Service —
# never from outside the cluster. Same code, same databases — only the auth profile
# differs. External operators/automation keep using the mTLS `dms-api`.
#
# SECURITY / SCOPE: this exposes the full API surface without mTLS, gated by network
# isolation + the shared token. A compromised trusted pod could impersonate an actor
# here; the NetworkPolicy + token bound the exposure to those clients. The external
# dms-api MUST separately be reachable only via the cert-terminating ingress/proxy (the
# `dms-api-from-ingress-only` NetworkPolicy in control-plane.yaml) — it trusts the
# `ssl-client-*` evidence headers, so any pod that could reach it directly could spoof an
# mTLS actor. For a tighter internal boundary (agent-ingest endpoint only) use
# per-endpoint auth in the app instead. Clients point `*_DMS_API_URL` at this Service and
# present `DMS_AUTH_SHARED_TOKEN` (agent-daemonset.yaml / portal.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-api-internal
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-api-internal
    app.kubernetes.io/part-of: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-api-internal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-api-internal
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-api
      containers:
        - name: api
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "api", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          # OVERRIDE the mTLS profile from dms-runtime-config: this internal instance
          # accepts the agent's `node:...` actor over plain HTTP + shared token. env wins
          # over envFrom, so this holds even when the shared ConfigMap enables mTLS.
          # DMS_AUTH_SHARED_TOKEN stays sourced from dms-secrets (the token is required).
          env:
            - name: DMS_REQUIRE_MTLS_HEADER
              value: "false"
            - name: DMS_REQUIRE_MTLS_VERIFIED_HEADER
              value: "false"
            - name: DMS_DEFAULT_ACTOR
              value: ""
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: kubeconfigs
              mountPath: /etc/dms/kubeconfigs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "500m"
              memory: 512Mi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dms-cluster-kubeconfigs
---
apiVersion: v1
kind: Service
metadata:
  name: dms-api-internal
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-api-internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dms-api-internal
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Only TRUSTED in-cluster clients reach the internal API: the node agent DaemonSets and
# the portal BFF (namespace dms-portal). Everything else — direct operators, external
# automation — must use the mTLS-guarded external dms-api. External traffic never lands
# here (ClusterIP + this policy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dms-api-internal-trusted-clients
  namespace: dms
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dms-api-internal
  policyTypes:
    - Ingress
  ingress:
    - from:
        # node agents (same namespace)
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["dms-dm-agent", "dms-rm-agent"]
        # portal BFF (dms-portal namespace) — trusted multi-operator client that carries
        # per-operator identity via x-dms-actor, which the mTLS external API can't accept.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dms-portal
      ports:
        - protocol: TCP
          port: http
