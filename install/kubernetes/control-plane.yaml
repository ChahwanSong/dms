apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-api
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-planner
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-rm-worker
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-dm-worker
  namespace: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-runtime-config
  namespace: dms
data:
  DMS_WORKER_LEASE_SECONDS: "300"
  DMS_PREVIEW_TTL_SECONDS: "86400"
  DMS_AGENT_REPORT_STALE_SECONDS: "300"
  DMS_CONTROL_CLUSTER_NAME: "cluster-a"
  DMS_KUBERNETES_INVENTORY_MODE: "kubectl"
  DMS_KUBERNETES_MUTATION_MODE: "kubectl"
  DMS_CLUSTER_KUBECONFIGS_JSON: '{"cluster-a":"/etc/dms/kubeconfigs/cluster-a.kubeconfig"}'
  DMS_KUBERNETES_INVENTORY_TIMEOUT_SECONDS: "10"
  DMS_KUBERNETES_MUTATION_TIMEOUT_SECONDS: "30"
  DMS_FILESYSTEM_MUTATION_MODE: "ssh-host-exec"
  DMS_FILESYSTEM_EXEC_TIMEOUT_SECONDS: "300"
  DMS_FILESYSTEM_EXEC_USE_SUDO: "true"
  DMS_LDAP_URI: "ldap://ldap.example.internal:389"
  DMS_LDAP_BASE_DN: "dc=example,dc=internal"
  DMS_LDAP_USER_SEARCH_BASE: "ou=people,dc=example,dc=internal"
  DMS_LDAP_GROUP_SEARCH_BASE: "ou=groups,dc=example,dc=internal"
  DMS_LDAP_USER_FILTER: "(uid={username})"
  DMS_LDAP_TIMEOUT_SECONDS: "5"
  DMS_LDAP_GROUP_GID_START: "24000"
  DMS_LDAP_GROUP_GID_END: "24999"
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  DMS_DATABASE_URL: "postgresql://dms_app:CHANGE_ME@postgres.example.internal:5432/dms"
  DMS_OBSERVABILITY_DATABASE_URL: "postgresql://dms_obs:CHANGE_ME@postgres.example.internal:5432/dms_observability"
  DMS_AUTH_SHARED_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
  DMS_LDAP_BIND_DN: "cn=dms,ou=service-accounts,dc=example,dc=internal"
  DMS_LDAP_BIND_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-ssh-client
  namespace: dms
type: Opaque
stringData:
  id_ed25519: |
    # Backend 관리 명령 실행이 허용된 private key로 교체한다.
  known_hosts: |
    # CephFS/GPFS RM host의 ssh-keyscan output으로 교체한다.
  config: |
    Host *
      IdentitiesOnly yes
      StrictHostKeyChecking yes
      UserKnownHostsFile /home/dms/.ssh/known_hosts
      IdentityFile /home/dms/.ssh/id_ed25519
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-cluster-kubeconfigs
  namespace: dms
type: Opaque
stringData:
  cluster-a.kubeconfig: |
    # install/scripts/create-serviceaccount-kubeconfig.sh로 생성한 kubeconfig로 교체한다.
    apiVersion: v1
    kind: Config
    clusters: []
    users: []
    contexts: []
    current-context: ""
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dms-migrate
  namespace: dms
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-migrate
        app.kubernetes.io/part-of: dms
    spec:
      restartPolicy: OnFailure
      serviceAccountName: dms-api
      containers:
        - name: migrate
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "migrate"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-api
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-api
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-api
      containers:
        - name: api
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "api", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: kubeconfigs
              mountPath: /etc/dms/kubeconfigs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dms-cluster-kubeconfigs
---
apiVersion: v1
kind: Service
metadata:
  name: dms-api
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: dms-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-planner
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-planner
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-planner
      containers:
        - name: planner
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "planner", "--loop", "--interval", "5", "--limit", "50"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          volumeMounts:
            - name: kubeconfigs
              mountPath: /etc/dms/kubeconfigs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dms-cluster-kubeconfigs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-rm-worker
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-rm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-rm-worker
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: rm
    spec:
      serviceAccountName: dms-rm-worker
      initContainers:
        - name: prepare-ssh-client
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /ssh-source/id_ed25519 /ssh/id_ed25519
              cp /ssh-source/known_hosts /ssh/known_hosts
              cp /ssh-source/config /ssh/config
              chown 65532:65532 /ssh/id_ed25519 /ssh/known_hosts /ssh/config
              chmod 0400 /ssh/id_ed25519 /ssh/config
              chmod 0444 /ssh/known_hosts
          volumeMounts:
            - name: ssh-client-source
              mountPath: /ssh-source
              readOnly: true
            - name: ssh-client
              mountPath: /ssh
      containers:
        - name: rm-worker
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "rm-worker", "--worker-id", "$(POD_NAME)", "--loop", "--interval", "5"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOME
              value: /home/dms
          volumeMounts:
            - name: kubeconfigs
              mountPath: /etc/dms/kubeconfigs
              readOnly: true
            - name: ssh-client
              mountPath: /home/dms/.ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dms-cluster-kubeconfigs
        - name: ssh-client
          emptyDir: {}
        - name: ssh-client-source
          secret:
            secretName: dms-ssh-client
            defaultMode: 0400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-dm-worker
  namespace: dms
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-dm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-dm-worker
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: dm
    spec:
      serviceAccountName: dms-dm-worker
      containers:
        - name: dm-worker
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "dm-worker", "--worker-id", "$(POD_NAME)", "--loop", "--interval", "5"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
