apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-api
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-planner
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-rm-worker
  namespace: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-dm-worker
  namespace: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-runtime-config
  namespace: dms
data:
  DMS_WORKER_LEASE_SECONDS: "300"
  DMS_PREVIEW_TTL_SECONDS: "86400"
  DMS_AGENT_REPORT_STALE_SECONDS: "300"
  DMS_CONTROL_CLUSTER_NAME: "cluster-a"
  DMS_KUBERNETES_INVENTORY_MODE: "kubectl"
  DMS_KUBERNETES_MUTATION_MODE: "kubectl"
  DMS_CLUSTER_KUBECONFIGS_JSON: '{"cluster-a":"/etc/dms/kubeconfigs/cluster-a.kubeconfig"}'
  DMS_KUBERNETES_INVENTORY_TIMEOUT_SECONDS: "10"
  DMS_KUBERNETES_MUTATION_TIMEOUT_SECONDS: "30"
  DMS_FILESYSTEM_MUTATION_MODE: "ssh-host-exec"
  DMS_FILESYSTEM_EXEC_TIMEOUT_SECONDS: "300"
  DMS_FILESYSTEM_EXEC_USE_SUDO: "true"
  DMS_REQUIRE_MTLS_HEADER: "true"
  DMS_REQUIRE_MTLS_VERIFIED_HEADER: "true"
  DMS_MTLS_ACTOR_PREFIX: "mtls:"
  DMS_LDAP_URI: "ldap://ldap.example.internal:389"
  DMS_LDAP_BASE_DN: "dc=example,dc=internal"
  DMS_LDAP_USER_SEARCH_BASE: "ou=people,dc=example,dc=internal"
  DMS_LDAP_GROUP_SEARCH_BASE: "ou=groups,dc=example,dc=internal"
  DMS_LDAP_USER_FILTER: "(uid={username})"
  DMS_LDAP_TIMEOUT_SECONDS: "5"
  DMS_LDAP_GROUP_GID_START: "24000"
  DMS_LDAP_GROUP_GID_END: "24999"
  DMS_DM_NAMESPACE: "dms"
  DMS_DM_JOB_IMAGE: "registry.example.internal/dms-mpifileutils:CHANGE_ME"
  DMS_DM_JOB_IMAGE_REF: "CHANGE_ME_MPIFILEUTILS_GIT_REF"
  DMS_DM_SERVICE_ACCOUNT: "dms-dm-worker"
  DMS_DM_ARTIFACT_BASE_URI: "file:///artifacts/dms"
  DMS_DM_DEFAULT_PRIORITY: "Mid"
  DMS_DM_DEFAULT_MAX_NODES: "1"
  DMS_DM_MAX_NODES: "1"
  DMS_DM_POLICY_DEFAULT_WORKER_NODES: "3"
  DMS_DM_POLICY_MAX_WORKER_NODES: "3"
  DMS_DM_POLICY_DEFAULT_PROCESSES_PER_NODE: "3"
  DMS_DM_POLICY_MAX_PROCESSES_PER_NODE: "10"
  DMS_DM_POLICY_DEFAULT_QUEUE: "dms-data"
  DMS_DM_POLICY_DEFAULT_PRIORITY_CLASS: "dms-normal"
  DMS_DM_SCHEDULER_BACKEND: "auto"
  DMS_DM_SCAN_TIMEOUT_SECONDS: "3600"
  DMS_DM_SYNC_PREVIEW_TIMEOUT_SECONDS: "3600"
  DMS_DM_SYNC_EXECUTION_TIMEOUT_SECONDS: "259200"
  DMS_DM_RM_PREVIEW_TIMEOUT_SECONDS: "1800"
  DMS_DM_RM_EXECUTION_TIMEOUT_SECONDS: "3600"
  DMS_DM_CONFIRM_REQUIRE_PREVIEW_FINGERPRINT: "true"
  DMS_DM_SYNC_ALLOW_DELETE: "true"
  DMS_DM_MAX_SYNC_NODES: "1"
  DMS_DM_MAX_RM_NODES: "1"
  DMS_DM_NSYNC_ENABLED: "true"
  DMS_DM_NSYNC_SERVICE_PREFIX: "dms-nsync"
  DMS_DM_MONITOR_POLL_SECONDS: "5"
  DMS_DM_JOB_DELETE_ON_TERMINAL: "false"
  DMS_DM_KUBERNETES_MODE: "cluster"
  # 운영자 root(privileged) 실행 허용. mTLS-verified operator만 API edge에서 통과(평문 root 요청은 403).
  DMS_DM_ALLOW_ROOT_REQUESTER: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  DMS_DATABASE_URL: "postgresql://dms_app:CHANGE_ME@postgres.example.internal:5432/dms"
  DMS_OBSERVABILITY_DATABASE_URL: "postgresql://dms_obs:CHANGE_ME@postgres.example.internal:5432/dms_observability"
  DMS_AUTH_SHARED_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
  DMS_LDAP_BIND_DN: "cn=dms,ou=service-accounts,dc=example,dc=internal"
  DMS_LDAP_BIND_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-client-ca
  namespace: dms
type: Opaque
stringData:
  ca.crt: |
    # DMS API client certificate CA bundle for ingress mTLS validation.
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-ssh-client
  namespace: dms
type: Opaque
stringData:
  id_ed25519: |
    # Backend 관리 명령 실행이 허용된 private key로 교체한다.
  known_hosts: |
    # CephFS/GPFS RM host의 ssh-keyscan output으로 교체한다.
  config: |
    Host *
      IdentitiesOnly yes
      StrictHostKeyChecking yes
      UserKnownHostsFile /home/dms/.ssh/known_hosts
      IdentityFile /home/dms/.ssh/id_ed25519
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-cluster-kubeconfigs
  namespace: dms
type: Opaque
stringData:
  cluster-a.kubeconfig: |
    # install/scripts/create-serviceaccount-kubeconfig.sh로 생성한 kubeconfig로 교체한다.
    apiVersion: v1
    kind: Config
    clusters: []
    users: []
    contexts: []
    current-context: ""
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dms-dm-volcano
  namespace: dms
rules:
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kubeflow.org"]
    resources: ["mpijobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dms-dm-volcano
  namespace: dms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dms-dm-volcano
subjects:
  - kind: ServiceAccount
    name: dms-dm-worker
    namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dms-api-dm-terminate
  namespace: dms
# The data-job cancel endpoint runs in the dms-api process and calls `kubectl delete` on the
# VolcanoJob/MPIJob so an in-flight data job (the MPI run) is actually stopped -- not just
# marked Cancelled in the DB. Without these verbs the terminate fails (Forbidden) and the MPI
# keeps running to completion despite the cancel.
rules:
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "delete"]
  - apiGroups: ["kubeflow.org"]
    resources: ["mpijobs"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dms-api-dm-terminate
  namespace: dms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dms-api-dm-terminate
subjects:
  - kind: ServiceAccount
    name: dms-api
    namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dms-api-agent-rollout
  namespace: dms
# The agent rollout-restart endpoint runs in the dms-api process and stamps the
# `restartedAt` annotation on the dms-rm-agent / dms-dm-agent DaemonSets so they
# re-read storages.json after a storage mapping change (agents read it once at
# startup). Read is needed to report rollout progress. Same in-cluster access the
# dms-agent-storages ConfigMap sync already uses.
# NOTE: bind to the identity dms-api actually uses to reach the CONTROL cluster —
# the pod SA (below) for in-cluster access, OR the ServiceAccount its control-cluster
# kubeconfig authenticates as when DMS_CLUSTER_KUBECONFIGS_JSON is set (grant that SA
# the same rule). Both need get+patch on the two agent DaemonSets.
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dms-api-agent-rollout
  namespace: dms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dms-api-agent-rollout
subjects:
  - kind: ServiceAccount
    name: dms-api
    namespace: dms
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dms-migrate
  namespace: dms
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-migrate
        app.kubernetes.io/part-of: dms
    spec:
      restartPolicy: OnFailure
      serviceAccountName: dms-api
      containers:
        - name: migrate
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "migrate"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-api
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-api
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-api
      containers:
        - name: api
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "api", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: kubeconfigs
              mountPath: /etc/dms/kubeconfigs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dms-cluster-kubeconfigs
---
apiVersion: v1
kind: Service
metadata:
  name: dms-api
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: dms-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dms-api-from-ingress-only
  namespace: dms
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dms-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-planner
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-planner
        app.kubernetes.io/part-of: dms
    spec:
      serviceAccountName: dms-planner
      containers:
        - name: planner
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "planner", "--loop", "--interval", "5", "--limit", "50"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          volumeMounts:
            - name: kubeconfigs
              mountPath: /etc/dms/kubeconfigs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dms-cluster-kubeconfigs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-rm-worker
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-rm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-rm-worker
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: rm
    spec:
      serviceAccountName: dms-rm-worker
      initContainers:
        - name: prepare-ssh-client
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /ssh-source/id_ed25519 /ssh/id_ed25519
              cp /ssh-source/known_hosts /ssh/known_hosts
              cp /ssh-source/config /ssh/config
              chown 65532:65532 /ssh/id_ed25519 /ssh/known_hosts /ssh/config
              chmod 0400 /ssh/id_ed25519 /ssh/config
              chmod 0444 /ssh/known_hosts
          volumeMounts:
            - name: ssh-client-source
              mountPath: /ssh-source
              readOnly: true
            - name: ssh-client
              mountPath: /ssh
      containers:
        - name: rm-worker
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "rm-worker", "--worker-id", "$(POD_NAME)", "--loop", "--interval", "5"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOME
              value: /home/dms
          volumeMounts:
            - name: kubeconfigs
              mountPath: /etc/dms/kubeconfigs
              readOnly: true
            - name: ssh-client
              mountPath: /home/dms/.ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dms-cluster-kubeconfigs
        - name: ssh-client
          emptyDir: {}
        - name: ssh-client-source
          secret:
            secretName: dms-ssh-client
            defaultMode: 0444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-dm-worker
  namespace: dms
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-dm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-dm-worker
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: dm
    spec:
      serviceAccountName: dms-dm-worker
      containers:
        - name: dm-worker
          image: registry.example.internal/dms:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "dm-worker", "--worker-id", "$(POD_NAME)", "--loop", "--interval", "5"]
          # dm-worker runs as root so it can read requester-owned, locked-down artifact
          # files (summary.json) on the shared FS (job artifacts are `umask 077` +
          # requester-only, unreadable by other tenants' job pods). It is a read-only
          # orchestrator -- no filesystem writes, only `kubectl` with the ServiceAccount
          # token and reading summary.json behind a symlink-containment guard -- so root
          # grants no privilege beyond that cross-uid read. (api/planner/rm-worker stay
          # non-root uid 65532.)
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            # Mount the shared-filesystem *mount point* (not the artifact
            # subdirectory) with HostToContainer (rslave) propagation. dm-worker
            # is a long-lived orchestrator that reads other nodes' job artifacts
            # off the shared FS. With the default (None) propagation a bind of a
            # subdirectory under the FS goes stale if the host re-mounts the FS
            # mid-session, so the worker stops seeing fresh artifacts until it is
            # restarted. rslave lets host (re-)mounts propagate into the
            # container live. Requires the host mount point and / to be `shared`.
            - name: dm-artifacts
              mountPath: /artifacts
              mountPropagation: HostToContainer
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: dm-artifacts
          hostPath:
            # MUST be the shared-FS mount point itself (the artifact tree lives
            # under <mountPath>/dms, see DMS_DM_ARTIFACT_BASE_URI), never a
            # subdirectory under it -- a subdir bind cannot receive the host
            # re-mount even with HostToContainer. Deployments substitute the real
            # mount point (the testbed uses the CephFS mount /cephfs). `Directory`
            # (not DirectoryOrCreate) so the pod fails fast if the FS is unmounted
            # rather than silently binding an empty local dir.
            path: /artifacts
            type: Directory
