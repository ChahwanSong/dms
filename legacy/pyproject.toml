[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dms"
version = "0.1.0"
description = "Data Management Service phase 1 skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
ldap = ["ldap3>=2.9"]
kubernetes = ["kubernetes>=30.0"]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
test = ["httpx>=0.27", "pytest>=8.0"]
# Portal BFF (src/portal/backend). httpx is the DMS HTTP client; itsdangerous
# backs Starlette's signed session cookie; psycopg[+pool] is the portal's own
# Postgres store (login + data-backup batches/jobs). fastapi/uvicorn/pydantic
# come from the base deps and are shared with the DMS backend in the same venv.
portal = [
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.scripts]
dms = "dms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
