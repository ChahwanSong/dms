# DM job scheduling objects — apply AFTER installing Volcano (see 0.prerequisites.md),
# BEFORE running any DM job. Every DM job manifest DMS submits references these by name:
#   spec.queue            = DMS_DM_POLICY_DEFAULT_QUEUE            (default "dms-data")
#   spec.priorityClassName = DMS_DM_POLICY_DEFAULT_PRIORITY_CLASS  (default "dms-normal")
# A MISSING queue leaves jobs Pending forever (Volcano never dispatches); a MISSING
# PriorityClass makes the kube-apiserver REJECT the job pod at admission.
#
#   kubectl apply -f install/kubernetes/volcano-queue-priorityclasses.yaml
#   kubectl get queue.scheduling.volcano.sh dms-data
#   kubectl get priorityclass | grep dms
#
# Keep the names in sync with the DMS_DM_POLICY_DEFAULT_* values in control-plane.yaml
# (and any per-tool policy overrides registered via the DMS API).
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: dms-data
spec:
  weight: 1
  reclaimable: true
---
# Three tiers map to the DMS priority labels (Low/Mid/High). dms-normal is the default.
# globalDefault:false so these NEVER become the cluster-wide default priority.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: dms-low
value: 50
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "DMS data jobs — low priority (background copies/scans)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: dms-normal
value: 100
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "DMS data jobs — normal priority (default)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: dms-high
value: 200
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "DMS data jobs — high priority (operator-expedited)."
