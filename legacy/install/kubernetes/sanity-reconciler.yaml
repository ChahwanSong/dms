# Storage-mapping readiness reconciler (layer ①).
#
# Periodically re-runs storage-mapping sanity so `readiness` tracks live agent evidence
# automatically (instead of requiring a manual `:check`). Reuses the same sanity path as
# the API, so the data_management and inventory axes stay consistent.
#
# Self-healing:
#   * Heartbeat-driven livenessProbe — each reconcile cycle writes a heartbeat file; if
#     the loop hangs the heartbeat goes stale and the kubelet restarts the pod.
#   * Stateless + idempotent — a restart resumes with a full sweep; no recovery logic.
#   * replicas: 1 (singleton). The reconcile is a pure projection (last-writer-wins), so
#     a Lease-based leader election is optional; add it only if you run >1 replica.
#   * It is an OPTIMISATION, not a correctness dependency: the planner staleness gate
#     (DMS_SANITY_PLANNER_GATE_ENABLED, DM only) fail-closes if this stops refreshing.
#
# Enable order: deploy + confirm healthy, THEN set DMS_SANITY_PLANNER_GATE_ENABLED=true
# on the planner (turning the gate on without a running reconciler would fail-close DM).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-sanity-reconciler
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-sanity-reconciler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-sanity-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-sanity-reconciler
    spec:
      serviceAccountName: dms-planner
      containers:
        - name: sanity-reconciler
          image: registry.example.internal/dms:CHANGE_ME
          command: ["dms", "sanity-reconciler", "--loop", "--interval", "30"]
          envFrom:
            - configMapRef:
                name: dms-runtime-config
            - secretRef:
                name: dms-secrets
          env:
            - name: DMS_SANITY_RECONCILE_HEARTBEAT_PATH
              value: /tmp/dms-sanity-reconciler.heartbeat
            - name: DMS_SANITY_RECONCILE_INTERVAL_SECONDS
              value: "30"
            - name: DMS_SANITY_TTL_SECONDS
              value: "120"
          # Read-only cluster kubeconfigs: the reconciler mirrors the API's
          # KubectlReadOnlyInventoryAdapter so it can validate CSI mappings on
          # agentless managed clusters (kubectl inventory mode). For ssh-kubectl
          # inventory mode (DMS_KUBERNETES_INVENTORY_MODE / DMS_CLUSTER_CONTROL_HOSTS_JSON)
          # you must additionally mount an SSH key Secret at /home/dms/.ssh yourself —
          # the control plane no longer ships one.
          volumeMounts:
            - name: kubeconfigs
              mountPath: /etc/dms/kubeconfigs
              readOnly: true
          livenessProbe:
            # Heartbeat freshness: fail (→ restart) if no cycle completed in ~4 intervals.
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/dms-sanity-reconciler.heartbeat 2>/dev/null || echo 0) )) -lt 120
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dms-cluster-kubeconfigs
