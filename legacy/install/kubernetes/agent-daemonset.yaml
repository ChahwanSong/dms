apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dms-agent
  namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dms-agent-readonly
# Minimal: the agent only ever fetches single named objects —
# nodes/<node> (node UID), storageclasses/<name> and csidrivers/<name> (CSI probe).
# No list, and no pods.
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dms-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dms-agent-readonly
subjects:
  - kind: ServiceAccount
    name: dms-agent
    namespace: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-agent-runtime-config
  namespace: dms
data:
  DMS_AGENT_API_URL: "http://dms-api-internal.dms.svc.cluster.local:80"
  DMS_AGENT_CLUSTER_NAME: "cluster-a"
  DMS_AGENT_REPORT_INTERVAL_SECONDS: "60"
  DMS_AGENT_REPORT_TIMEOUT_SECONDS: "5"
  # DM job tools only -- these are the names _tool_ready() gates a candidate node on.
  # kubectl is deliberately absent: the agent talks to the Kubernetes API directly, not
  # through the CLI, so probing it only adds a permanently-Missing entry to the inventory.
  DMS_AGENT_TOOLS: "dsync,nsync,drm,dscan"
  # REQUIRED for mount readiness. The agent runs in a container, so its own
  # /proc/self/mountinfo (the default) shows only the CONTAINER's mounts — never the
  # worker node's storage mounts (cephfs/gpfs/weka), so every mount probes as Missing
  # and DM readiness is false. Point it at the HOST init's mount table, bind-mounted
  # into the pod at /host/proc/1/mountinfo (see the DaemonSet volumes below). With this,
  # the agent reads the host's real mounts and infers Ready + rw/ro from mountinfo — no
  # per-storage hostPath mounts needed.
  DMS_AGENT_MOUNTINFO_PATH: "/host/proc/1/mountinfo"
  # Host root filesystem bind-mounted at /host (see DaemonSet volumes). Two uses:
  # per-node disk-usage metrics, and the resolution root for on-demand POSIX identity
  # probing (chroot $HOST_ROOT getent / $HOST_ROOT/etc/passwd — see dms-04 §3).
  # Optional for readiness (that comes from mountinfo).
  DMS_AGENT_HOST_ROOT: "/host"
---
apiVersion: v1
kind: Secret
metadata:
  name: dms-agent-secrets
  namespace: dms
type: Opaque
stringData:
  DMS_AUTH_SHARED_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-agent-storages
  namespace: dms
data:
  # BOOTSTRAP seed only. dms-api OVERWRITES this ConfigMap from the registered storage
  # mappings on every storage create/update/delete (requires the dms-agent-storages-sync
  # RBAC in control-plane.yaml). Agents read it once at startup, so after a mapping change
  # the DaemonSets must be restarted (POST /api/v1/agent/rollout-restart or kubectl rollout
  # restart). For a filesystem storage, mount_paths MUST list the HOST mount point(s) so
  # the agent can probe mount readiness. A CSI storage has no host mount, so mount_paths
  # is [] and its data_management axis stays Missing -- it is a PVC<->PVC sync target, not
  # a host-path DM target.
  storages.json: |
    {
      "storages": [
        {
          "storage_name": "cephfs-a",
          "backend_type": "cephfs",
          "cluster_name": "cluster-a",
          "mount_paths": ["/cephfs"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dms-dm-agent
  namespace: dms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-dm-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-dm-agent
        app.kubernetes.io/part-of: dms
        dms.io/worker-role: dm
    spec:
      serviceAccountName: dms-agent
      containers:
        - name: agent
          # The agent MUST use the dms-AGENT image (built from install/docker/Dockerfile.agent),
          # which layers the mpifileutils tools (dsync/dscan/drm/nsync) onto PATH. The agent
          # probes for them with `which`; on the plain `dms` image they are ABSENT, so every
          # DM candidate node is rejected (missing_dscan/dsync/drm_tool) and DM jobs never
          # schedule. Build the job image first, then build this agent image with
          # --build-arg MFU_IMAGE=<job image> so the agent's tools match the job's.
          image: registry.example.internal/dms-agent:CHANGE_ME
          imagePullPolicy: IfNotPresent
          command: ["dms", "agent-loop"]
          envFrom:
            - configMapRef:
                name: dms-agent-runtime-config
            - secretRef:
                name: dms-agent-secrets
          env:
            - name: DMS_AGENT_WORKER_ROLE
              value: DM
            # Comma-separated POSIX usernames the agent probes on EVERY cycle -- a warm
            # baseline, not the whole allowlist. A requester who is not listed is probed
            # ON DEMAND (dm-worker registers them, the agent picks the target up in its
            # next report and probes it), so new requesters work without editing this.
            # What is actually required is that the node itself can resolve the user via
            # NSS/SSSD (getpwnam); if it cannot, the candidate is rejected with
            # identity_not_ready_on_node. Privileged-root jobs bypass the gate.
            # See dms-04 §3 (step 5) and dms-05 for the on-demand tuning knobs.
            - name: DMS_AGENT_IDENTITY_USERS
              value: "CHANGE_ME_user1,CHANGE_ME_user2"
            - name: DMS_AGENT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: storages
              mountPath: /etc/dms/agent
              readOnly: true
            # Host root (for per-node disk metrics + identity probing). `/proc` is a
            # separate mount so it is NOT visible under this; hence the explicit
            # proc-mountinfo mount below.
            - name: host-root
              mountPath: /host
              readOnly: true
            # The host init's mount table (DMS_AGENT_MOUNTINFO_PATH). Without this
            # the agent sees only container mounts and every storage probes Missing.
            - name: proc-mountinfo
              mountPath: /host/proc/1/mountinfo
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: storages
          configMap:
            name: dms-agent-storages
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: proc-mountinfo
          hostPath:
            path: /proc/1/mountinfo
            type: File
