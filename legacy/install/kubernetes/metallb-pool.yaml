# MetalLB address pool for the DMS testbed.
#
# The cluster nodes are VMs on the host bridge dmsbr0 (10.10.10.0/24, host = .1).
# In use at install time: .1 (bridge host), .10-.15 (k8s nodes), .20-.23, .30
# (PostgreSQL). libvirt's dnsmasq on this bridge serves DNS only — its config has no
# dhcp-range — so there is no DHCP pool that could hand out a colliding lease.
# .200-.210 is therefore free and well clear of everything above.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dms-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.10.10.200-10.10.10.210
---
# Layer-2 mode: one node answers ARP for the assigned IP. No BGP peer exists on this
# bridge, and L2 needs nothing from the network fabric — the right choice here.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: dms-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - dms-pool
